  if (adDone) return;

    adDone = done; adTimer = setTimeout(finishAd, 4000);

function parse(code) {
  const cars = [];
  for (let i = 0; i < N * N; i++) {
    if (code[i] === '.') continue;
    const k = code.charCodeAt(i) - 65, row = Math.floor(i / N), col = i % N;
    if (!cars[k]) cars[k] = { row, col, len: 1, horiz: true };
    else { cars[k].len++; if (col === cars[k].col) cars[k].horiz = false; }
  }
  return cars;
}
function occupancy(cars, skip) {
  const occ = new Int8Array(N * N);
  cars.forEach((c, i) => { if (i !== skip) for (let k = 0; k < c.len; k++) occ[(c.row + (c.horiz ? 0 : k)) * N + c.col + (c.horiz ? k : 0)] = 1; });
  return occ;
}
// How far car i can slide: [lowest, highest] value of its moving coordinate.
function range(cars, i) {
  const c = cars[i], occ = occupancy(cars, i), fixed = c.horiz ? c.row : c.col;
  const free = p => !occ[c.horiz ? fixed * N + p : p * N + fixed];
  let lo = c.horiz ? c.col : c.row, hi = lo;
  while (lo > 0 && free(lo - 1)) lo--;
  while (hi + c.len < N && free(hi + c.len)) hi++;
  return [lo, hi];
}
function solved(cars) { return cars[0].col + cars[0].len === N; }
// Breadth-first search from the current position. Returns the shortest list of [car, to] moves.
function solve(cars) {
  const start = cars.map(c => c.horiz ? c.col : c.row), key = p => p.join('');
  const from = new Map([[key(start), null]]);
  let frontier = [start];
  const at = p => cars.map((c, i) => c.horiz ? { row: c.row, col: p[i], len: c.len, horiz: true } : { row: p[i], col: c.col, len: c.len, horiz: false });
  while (frontier.length) {
    const next = [];
    for (const pos of frontier) {
      if (pos[0] + cars[0].len === N) {
        const path = [];
        for (let k = key(pos), e = from.get(k); e; k = e.prev, e = from.get(k)) path.unshift([e.car, e.to]);
        return path;
      }
      const cur = at(pos);
      for (let i = 0; i < cars.length; i++) {
        const r = range(cur, i);
        for (let p = r[0]; p <= r[1]; p++) {
          if (p === pos[i]) continue;
          const np = pos.slice(); np[i] = p;
          const k = key(np);
          if (!from.has(k)) { from.set(k, { prev: key(pos), car: i, to: p }); next.push(np); }
        }
      }
    }
    frontier = next;
  }
  return null;
}

function musicTick() {

  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  land = W > H * 1.15;
  sw = land ? 160 : 100; sh = land ? 100 : 160;
  u = Math.min(W / sw, H / sh);
  x0 = (W - sw * u) / 2; y0 = (H - sh * u) / 2;
}

}

}

}

}

  hint = null;
  if (QS.get('win')) { persist = () => {}; win(); winT = 2; }
}
if (LOCAL && QS.get('coins')) { persist = () => {}; save.coins = +QS.get('coins'); }
if (LOCAL && QS.get('screen')) { page = +QS.get('page') || 0; screen = QS.get('screen'); }
// Local self-test (tools/smoke_test.py): the hint solver must reproduce every level's recorded minimum.
if (LOCAL && QS.get('selftest')) document.title = 'selftest:' + LEVELS.length + ':' + LEVELS.map((b, i) => solve(parse(b)).length === PAR[i] ? 0 : i + 1).filter(Boolean).join(',');
// Local trailer renderer: solves one level on screen, then shows a few moves in each other world,
// at a fixed 30 fps, and posts each frame to the local capture server.
async function demoLoop() {
  const dt = 1 / 30, tour = [4, 30, 50, 70, 90];
  let n = 0, mt = 0, li = 0, played = 0, path = null;
  persist = () => {};
  const snap = async () => {
    update(dt); draw();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.93));
    await fetch('/frame?v=' + DEMO + '&n=' + String(n++).padStart(4, '0'), { method: 'POST', body: blob });
  };
  const open = k => { startLevel(tour[k]); path = solve(cars); played = 0; mt = -0.3; };
  screen = 'menu';
  for (let i = 0; i < 40; i++) await snap();
  open(0);
  while (n < 720) {
    mt += dt;
    if (screen === 'game' && !slide && exitT < 0 && mt > 0.4 && path.length) {
      if (li > 0 && played >= 6) { if (++li >= tour.length) break; open(li); continue; }
      mt = 0; played++;
      const m = path.shift(), from = coord(cars[m[0]]);
      slide = { car: m[0], from, to: m[1], t: 0, then: () => afterMove(m[0], from) };
    }
    if (screen === 'win' && winT > 2) { if (++li >= tour.length) break; open(li); }
    await snap();
  }
  for (let i = 0; i < 12; i++) await snap();
  await fetch('/frame?v=' + DEMO + '&n=done', { method: 'POST', body: 'x' });
}
// Local cover renderer (?demo=cover&w=&h=): one still of a busy board under the title, posted as a PNG.
async function coverShot() {
  const wide = W > H * 1.2, w = WORLDS[0];
  u = Math.min(W, H) / (wide ? 100 : 110); x0 = y0 = 0; persist = () => {};
  level = 9; cars = parse(LEVELS[8]); specs = cars.map((c, i) => specFor(i)); screen = 'game'; time = 0.4;
  const size = wide ? H * 0.74 : Math.min(W * 0.8, H * 0.6);
  still = { x: wide ? W - size - H * 0.2 : (W - size) / 2 - W * 0.02, y: wide ? H * 0.13 : H - size - H * 0.07, cell: size / N, size };
  const b = still, c = b.cell, ey = b.y + EXIT_ROW * c;
  ground(w);
  road(w, b.x + b.size + u * 2, ey + c * 0.04, W, c * 0.92, false);
  scatter('cover', 3, [[b.x - u * 5, b.y - u * 5, size + u * 10, size + u * 10], [b.x + size, ey - u * 2, W, c + u * 4]]);
  drawDecor(w);
  const sh2 = wide ? g.createLinearGradient(0, 0, b.x, 0) : g.createLinearGradient(0, 0, 0, b.y);
  sh2.addColorStop(0, 'rgba(12,28,22,.62)'); sh2.addColorStop(1, 'rgba(12,28,22,0)');
  g.fillStyle = sh2; g.fillRect(0, 0, wide ? b.x : W, wide ? H : b.y);
  drawBoard();
  if (wide) {
    const cx = (b.x - u * 3) / 2;
    label('CAR JAM', cx, H * 0.27, H * 0.165, '#fff', 'center', '#16202c');
    label('ESCAPE', cx, H * 0.43, H * 0.12, w.accent, 'center', '#16202c');
    g.save(); g.translate(cx, H * 0.72); g.rotate(-0.14);
    drawCar(-H * 0.36, -H * 0.02, H * 0.3, H * 0.15, true, LOOKS[2]);
    drawCar(-H * 0.02, -H * 0.19, H * 0.42, H * 0.21, true, Object.assign({ me: true }, SKINS[0]));
    g.restore();
  } else {
    const top = b.y - u * 3;
    label('CAR JAM', W / 2, top * 0.4, Math.min(W * 0.19, top * 0.42), '#fff', 'center', '#16202c');
    label('ESCAPE', W / 2, top * 0.76, Math.min(W * 0.13, top * 0.29), w.accent, 'center', '#16202c');
  }
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  await fetch('/frame?v=' + DEMO + '-' + W + 'x' + H + '&n=cover&ext=png', { method: 'POST', body: blob });
  await fetch('/frame?v=' + DEMO + '-' + W + 'x' + H + '&n=done', { method: 'POST', body: 'x' });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!adPlaying) update(dt);
  musicTick();
  draw();
  requestAnimationFrame(frame);
}
if (DEMO === 'cover') coverShot(); else if (DEMO) demoLoop(); else requestAnimationFrame(frame);
})();
</script>
