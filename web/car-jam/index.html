// Ads: one source for every game (web/ads.js). tools/build.py pastes this file into each game
// in place of its ADS marker and fills in PORTAL and GAME_ID for the portal being packaged:
//   'gamemonetize'      GameMonetize HTML5 SDK (GAME_ID = game hash from their dashboard)
//   'gamedistribution'  GameDistribution HTML5 SDK (GAME_ID from their dashboard)
//   'crazygames'        CrazyGames SDK v3 (no id; only works on their domain)
//   'playgama'          Playgama Bridge v2 (no id; needs playgama-bridge-config.json next to index.html)
//   'none'              no SDK, no ads (itch.io, self-hosting, local testing)
// A game calls showAd(type, done), gameplay(on) and happy(), reads adPlaying to freeze and mute
// while an ad is on screen, and may define onPortalReady() to run once the SDK is up.
// SDK calls follow the pages listed in NGHIEN-CUU.md (checked 2026-10-12) and, for Playgama, CONG.md (checked 2026-10-13).
// ============================================================================
const PORTAL = 'gamemonetize';
const GAME_ID = '';
// No SDK and no ads when opened from disk or a local test server.
const LOCAL = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
// Rewarded ads come first: the player asked for them, so they are never held back. Midgame ads
// are skipped when any ad ended less than this many ms ago.
const MIDGAME_GAP = 60000;

let adPlaying = false, adDone = null, adType = '', adTimer = 0, adEnd = 0, rewardSeen = false, cg = null, pg = null, pgPaused = false, pgAd = false;
function finishAd(ok) {
  clearTimeout(adTimer); adPlaying = false; adEnd = Date.now();
  const f = adDone; adDone = null;
  if (f) f(ok !== false);
}
function loadScript(src, id, onload) {
  const s = document.createElement('script');
  s.id = id; s.src = src; s.onload = onload || null;
  document.head.appendChild(s);
}
// GameMonetize and GameDistribution report ads through the same event names.
function portalEvent(e) {
  if (e.name === 'SDK_GAME_PAUSE') { clearTimeout(adTimer); adPlaying = true; }            // ad on screen: freeze + mute
  else if (e.name === 'SDK_REWARDED_WATCH_COMPLETE') rewardSeen = true;
  else if (e.name === 'SDK_GAME_START') finishAd(PORTAL !== 'gamedistribution' || adType !== 'rewarded' || rewardSeen);
  else if (e.name === 'SDK_READY' && typeof onPortalReady === 'function') onPortalReady();
}

  window.SDK_OPTIONS = { gameId: GAME_ID, onEvent: portalEvent };

}

  if (state === 'opened') { clearTimeout(adTimer); pgAd = true; adPlaying = true; }

}

    const b = window.bridge;
    b.initialize().then(() => {
      pg = b;

      b.platform.on(b.EVENT_NAME.PAUSE_STATE_CHANGED, paused => { pgPaused = !!paused; adPlaying = pgPaused || pgAd; });

      // bridge copy is restored once and the page reloads so the game starts from it.
      const key = typeof SAVE_KEY === 'string' ? SAVE_KEY : '';
      const ready = () => { b.platform.sendMessage('game_ready'); if (typeof onPortalReady === 'function') onPortalReady(); };
      if (!key) return ready();

        const put = Storage.prototype.setItem;
        Storage.prototype.setItem = function (k, v) { put.call(this, k, v); if (k === key) pgSave(k, v); };
      } catch (e) {}
      b.storage.get([key]).then(data => {
        const cloud = data && data[0] ? (typeof data[0] === 'string' ? data[0] : JSON.stringify(data[0])) : '';

        if (cloud && !local && !again) {

  });

function showAd(type, done) {
  if (adDone) return;
  if (type !== 'rewarded' && Date.now() - adEnd < MIDGAME_GAP) return done(true);
  adType = type; rewardSeen = false;

    const ok = type === 'rewarded' ? pg.advertisement.isRewardedSupported : pg.advertisement.isInterstitialSupported;
    if (!ok) return done(type !== 'rewarded');
    adDone = done; adTimer = setTimeout(() => finishAd(type !== 'rewarded'), 4000);
    try { if (type === 'rewarded') pg.advertisement.showRewarded('reward'); else pg.advertisement.showInterstitial('level_completed'); } catch (e) { finishAd(type !== 'rewarded'); }
  } else if (cg) {
    adDone = done;
    cg.ad.requestAd(type, {
      adStarted: () => { adPlaying = true; },
      adFinished: () => finishAd(true),
      adError: e => finishAd(!(type === 'rewarded' && e && e.code === 'adblock'))
    });
  } else if (window.gdsdk && window.gdsdk.showAd) {
    // Carry on after 4s if no ad starts (no fill / blocked); a rewarded ad that never ran pays nothing.
    adDone = done; adTimer = setTimeout(() => finishAd(type !== 'rewarded'), 4000);
    const p = type === 'rewarded' ? window.gdsdk.showAd('rewarded') : window.gdsdk.showAd();
    if (p && p.catch) p.catch(() => { if (!adPlaying) finishAd(type !== 'rewarded'); });
  } else if (window.sdk && window.sdk.showBanner) {
    // GameMonetize has one ad format; carry on after 4s if no ad starts.
    adDone = done; adTimer = setTimeout(finishAd, 4000);
    window.sdk.showBanner();
  } else done(true);
}

function parse(code) {
  const cars = [];
  for (let i = 0; i < N * N; i++) {
    if (code[i] === '.') continue;
    const k = code.charCodeAt(i) - 65, row = Math.floor(i / N), col = i % N;
    if (!cars[k]) cars[k] = { row, col, len: 1, horiz: true };
    else { cars[k].len++; if (col === cars[k].col) cars[k].horiz = false; }
  }
  return cars;
}
function occupancy(cars, skip) {
  const occ = new Int8Array(N * N);
  cars.forEach((c, i) => { if (i !== skip) for (let k = 0; k < c.len; k++) occ[(c.row + (c.horiz ? 0 : k)) * N + c.col + (c.horiz ? k : 0)] = 1; });
  return occ;
}
// How far car i can slide: [lowest, highest] value of its moving coordinate.
function range(cars, i) {
  const c = cars[i], occ = occupancy(cars, i), fixed = c.horiz ? c.row : c.col;
  const free = p => !occ[c.horiz ? fixed * N + p : p * N + fixed];
  let lo = c.horiz ? c.col : c.row, hi = lo;
  while (lo > 0 && free(lo - 1)) lo--;
  while (hi + c.len < N && free(hi + c.len)) hi++;
  return [lo, hi];
}
function solved(cars) { return cars[0].col + cars[0].len === N; }
// Breadth-first search from the current position. Returns the shortest list of [car, to] moves.
function solve(cars) {
  const start = cars.map(c => c.horiz ? c.col : c.row), key = p => p.join('');
  const from = new Map([[key(start), null]]);
  let frontier = [start];
  const at = p => cars.map((c, i) => c.horiz ? { row: c.row, col: p[i], len: c.len, horiz: true } : { row: p[i], col: c.col, len: c.len, horiz: false });
  while (frontier.length) {
    const next = [];
    for (const pos of frontier) {
      if (pos[0] + cars[0].len === N) {
        const path = [];
        for (let k = key(pos), e = from.get(k); e; k = e.prev, e = from.get(k)) path.unshift([e.car, e.to]);
        return path;
      }
      const cur = at(pos);
      for (let i = 0; i < cars.length; i++) {
        const r = range(cur, i);
        for (let p = r[0]; p <= r[1]; p++) {
          if (p === pos[i]) continue;
          const np = pos.slice(); np[i] = p;
          const k = key(np);
          if (!from.has(k)) { from.set(k, { prev: key(pos), car: i, to: p }); next.push(np); }
        }
      }
    }
    frontier = next;
  }
  return null;
}

// Schedules the tune a little ahead of the audio clock; called every frame.
function musicTick() {

  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);

  sw = land ? 160 : 100; sh = land ? 100 : 160;

// Design language (THIET-KE.md): warm paper, white cards, one forest accent; serif headline, sans body, mono label.

// ---- Vehicles, seen from above. The (w x h) box's long side is the direction of travel.
// sp: { color, kind: sport | sedan | taxi | police | truck | bus | ghost, stripe, flip, me }
function drawCar(x, y, w, h, horiz, sp, alpha) {
  const L = horiz ? w : h, T = horiz ? h : w, pad = T * 0.1, bl = L - 2 * pad, bt = T - 2 * pad, col = sp.color;

  if (sp.kind === 'ghost') { g.fillStyle = '#fff'; rrect(-w / 2 + pad, -h / 2 + pad, w - 2 * pad, h - 2 * pad, T * 0.2); g.fill(); g.restore(); return; }

    g.fillStyle = '#fff3b0'; rrect(bl / 2 - T * 0.11, -bt * 0.4, T * 0.08, T * 0.15, T * 0.03); g.fill(); rrect(bl / 2 - T * 0.11, bt * 0.4 - T * 0.15, T * 0.08, T * 0.15, T * 0.03); g.fill();
    g.fillStyle = '#ff3344'; rrect(-bl / 2 + T * 0.03, -bt * 0.4, T * 0.06, T * 0.15, T * 0.02); g.fill(); rrect(-bl / 2 + T * 0.03, bt * 0.4 - T * 0.15, T * 0.06, T * 0.15, T * 0.02); g.fill();
  };
  g.fillStyle = '#161d27';                                        // wheels
  const wx = bl * (L > T * 2.5 ? 0.34 : 0.29);
  [[-wx, -1], [wx, -1], [-wx, 1], [wx, 1]].forEach(p => { rrect(p[0] - T * 0.12, p[1] * (bt / 2 - T * 0.03) - T * 0.06, T * 0.24, T * 0.12, T * 0.04); g.fill(); });

  if (sp.kind === 'truck') {
    const cl = T * 0.62, box = bl - cl - T * 0.05;
    g.fillStyle = '#eef1f5'; rrect(-bl / 2, -bt / 2, box, bt, T * 0.07); g.fill();
    g.lineWidth = T * 0.045; g.strokeStyle = shade(col, -0.15); g.stroke();
    g.fillStyle = col; g.fillRect(-bl / 2 + T * 0.1, -bt * 0.13, box - T * 0.2, bt * 0.26);
    g.fillStyle = 'rgba(0,0,0,.1)';

    g.fillStyle = body; rrect(bl / 2 - cl, -bt / 2 + T * 0.02, cl, bt - T * 0.04, T * 0.15); g.fill();
    g.fillStyle = '#1b2836'; rrect(bl / 2 - cl * 0.62, -bt * 0.37, cl * 0.3, bt * 0.74, T * 0.05); g.fill();
    g.fillStyle = shade(col, 0.16); rrect(bl / 2 - cl * 0.95, -bt * 0.34, cl * 0.3, bt * 0.68, T * 0.05); g.fill();
    lights();
  } else if (sp.kind === 'bus') {
    g.fillStyle = body; rrect(-bl / 2, -bt / 2, bl, bt, T * 0.14); g.fill();
    g.fillStyle = '#1b2836';
    g.fillRect(-bl * 0.4, -bt * 0.47, bl * 0.76, bt * 0.08); g.fillRect(-bl * 0.4, bt * 0.39, bl * 0.76, bt * 0.08);
    rrect(bl / 2 - T * 0.22, -bt * 0.38, T * 0.11, bt * 0.76, T * 0.04); g.fill();
    g.fillStyle = shade(col, 0.2); rrect(-bl / 2 + T * 0.12, -bt * 0.3, bl - T * 0.42, bt * 0.6, T * 0.08); g.fill();
    g.fillStyle = 'rgba(0,0,0,.16)';
    for (let k = 0; k < 3; k++) { rrect(-bl * 0.33 + k * bl * 0.25, -bt * 0.14, bt * 0.28, bt * 0.28, T * 0.04); g.fill(); }
    lights();
  } else {
    const gx0 = -bl / 2 + bl * 0.2, gx1 = bl / 2 - bl * 0.25;

      rrect(-bl / 2 + T * 0.1, -bt * 0.4, gx0 + bl / 2 - T * 0.12, bt * 0.8, T * 0.08); g.fill();
    }
    g.fillStyle = shade(col, -0.35);                              // mirrors
    g.fillRect(gx1 - T * 0.1, -bt / 2 - T * 0.04, T * 0.07, T * 0.06); g.fillRect(gx1 - T * 0.1, bt / 2 - T * 0.02, T * 0.07, T * 0.06);
    g.fillStyle = '#1b2836'; rrect(gx0, -bt * 0.41, gx1 - gx0, bt * 0.82, T * 0.12); g.fill();           // glass
    g.fillStyle = 'rgba(255,255,255,.2)'; rrect(gx1 - T * 0.11, -bt * 0.33, T * 0.04, bt * 0.3, T * 0.02); g.fill();

      g.fillStyle = '#fff'; rrect((rx0 + rx1) / 2 - T * 0.07, -bt * 0.2, T * 0.14, bt * 0.4, T * 0.03); g.fill();
      g.fillStyle = '#222b36';
      for (let k = 0; k < 4; k++) g.fillRect((rx0 + rx1) / 2 - T * 0.07 + (k % 2) * T * 0.07, -bt * 0.2 + k * bt * 0.1, T * 0.07, bt * 0.1);

function specFor(i) {

  const kind = cars[i].len > 2 ? (h % 2 ? 'truck' : 'bus') : h < 12 && mine !== 'taxi' ? 'taxi' : h < 20 && mine !== 'police' ? 'police' : 'sedan';
  return { kind, flip: h % 3 === 0, color: kind === 'taxi' ? '#ffcf33' : kind === 'police' ? '#eef2f7' : PAINT[(i - 1) % PAINT.length] };

    : level === 2 && moves < 3 ? ['Fewer moves,', 'more stars'] : level === 3 && moves < 3 ? ['Stuck?', 'Tap Hint'] : null;
  if (tip && exitT < 0) { if (land) bubble(tip, X(22), Y(86), u * 38); else bubble(tip, X(50), Y(127), u * 60); }
}
function drawWin() {
  const cx = X(sw / 2), cy = Y(sh / 2), a = Math.min(1, winT / 0.35);
  sceneGame(); drawBoard();
  g.fillStyle = 'rgba(26,26,26,' + (0.4 * a) + ')'; g.fillRect(0, 0, W, H);
  if (winT < 0.3) return;
  const k = backOut(clamp01((winT - 0.3) / 0.3)), pw = u * 84, ph = u * 88;
  g.save(); g.translate(cx, cy); g.scale(k, k); g.translate(-cx, -cy);
  card(cx - pw / 2, cy - ph / 2, pw, ph, u * 6);
  tag(daily ? 'Daily challenge  ·  ' + save.streak + ' day streak' : 'Level ' + level, cx, cy - u * 36, u * 2.8);
  head(earned === 3 ? 'Perfect' : 'Escaped', cx, cy - u * 26, u * 13);
  for (let j = 0; j < 3; j++) {
    const t = clamp01((winT - 0.7 - j * 0.22) / 0.25), sx = cx + (j - 1) * u * 16, sy = cy - u * 9;
    star(sx, sy, u * 6, C.line);
    if (j < earned && t > 0) star(sx, sy, u * 6 * backOut(t), C.accent);
  }
  tag('Moves ' + moves + '  ·  Best ' + PAR[level - 1], cx, cy + u * 4, u * 2.6);
  coin(cx - u * 6, cy + u * 12.5, u * 2.2); label('+' + gain, cx - u * 2, cy + u * 12.7, u * 4.2, C.text, 'left');
  if (daily) button('Done', cx, cy + u * 24, u * 68, u * 13, true, leaveLevel);
  else if (level < LEVELS.length) button('Next level', cx, cy + u * 24, u * 68, u * 13, true, nextLevel);
  else tag('All ' + LEVELS.length + ' levels done', cx, cy + u * 24, u * 3);
  button('Replay', cx - u * 17.5, cy + u * 37, u * 33, u * 10, false, () => { const d = daily; startLevel(level); daily = d; }, u * 3.4);
  button('Levels', cx + u * 17.5, cy + u * 37, u * 33, u * 10, false, () => { daily = false; leaveLevel(); }, u * 3.4);
  g.restore();
}

// ---- Input: drag a car along its lane.
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (adPlaying) return;
  initAudio();
  const x = e.clientX, y = e.clientY;
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { if (!b.quiet) sfx.click(); b.action(); return; }
  }
  if (screen !== 'game' || exitT >= 0) return;
  if (slide) endSlide();
  if (exitT >= 0) return;
  const b = board(), col = Math.floor((x - b.x) / b.cell), row = Math.floor((y - b.y) / b.cell);
  if (col < 0 || row < 0 || col >= N || row >= N) return;
  const i = cars.findIndex(c => c.horiz ? row === c.row && col >= c.col && col < c.col + c.len : col === c.col && row >= c.row && row < c.row + c.len);
  if (i < 0) return;
  const r = range(cars, i);
  drag = { car: i, start: coord(cars[i]), pos: coord(cars[i]), lo: r[0], hi: r[1], px: x, py: y, bumped: false };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mx = e.clientX; my = e.clientY; }
  if (!drag) return;
  const c = cars[drag.car], d = ((c.horiz ? e.clientX - drag.px : e.clientY - drag.py)) / board().cell;
  const want = drag.start + d;
  drag.pos = Math.max(drag.lo, Math.min(drag.hi, want));
  if ((want < drag.lo - 0.15 || want > drag.hi + 0.15) && !drag.bumped) { drag.bumped = true; shakeT = 0.12; sfx.bump(); }
  if (want >= drag.lo && want <= drag.hi) drag.bumped = false;
});
function release() {
  if (!drag) return;
  const to = Math.round(drag.pos), from = drag.start, i = drag.car, pos = drag.pos;
  drag = null;
  if (to !== from) slide = { car: i, from: pos, to, t: 0, d: 0.07, then: () => afterMove(i, from) };
  else if (pos !== from) slide = { car: i, from: pos, to, t: 0, d: 0.07 };
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', () => { mx = my = -1; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) e.preventDefault();
  if (adPlaying || e.repeat) return;
  initAudio();
  if (screen === 'game') {
    if (k === 'z' || k === 'u') undoMove(); else if (k === 'r') startLevel(level); else if (k === 'h') useHint(); else if (k === 'escape' && PORTAL !== 'crazygames') leaveLevel();   // CrazyGames asks games not to use Escape
  } else if (screen === 'win' && winT > 1 && (k === 'enter' || k === ' ') && level < LEVELS.length) nextLevel();
  else if ((screen === 'levels' || screen === 'shop') && k === 'escape' && PORTAL !== 'crazygames') go('menu');
});
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else if (!adPlaying) ac.resume();
});

// ---- Main loop
function update(dt) {
  time += dt; levelT += dt;
  fadeT = Math.max(0, fadeT - dt); shakeT = Math.max(0, shakeT - dt); denyT = Math.max(0, denyT - dt);
  if (slide) { slide.t += dt; if (slide.t >= (slide.d || 0.16)) endSlide(); }
  if (exitT >= 0 && screen === 'game') {
    exitT += dt;
    if (exitT > 0.12) { const r = carRect(0), b = board(); dust(r.x + Math.pow(exitT - 0.12, 2) * 26 * b.cell, r.y + r.h / 2, 1, 'rgba(240,240,245,.5)'); }
    if (exitT > 0.85) win();
  }
  if (screen === 'win') {
    winT += dt;
    while (starPing < earned && winT > 0.7 + starPing * 0.22) {
      sfx.star(starPing);
      burst(X(sw / 2) + (starPing - 1) * u * 18, Y(sh / 2) - u * 10, 14);
      starPing++;
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function draw() {
  btns = []; hot = false;
  if (screen === 'menu') drawMenu();
  else if (screen === 'levels') drawLevels();
  else if (screen === 'shop') drawShop();
  else if (screen === 'game') drawGame();
  else drawWin();
  for (const p of parts) {
    g.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    g.fillStyle = p.color;
    if (p.vr) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); g.restore(); }
    else { g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill(); }
  }
  g.globalAlpha = 1;
  if (fadeT > 0) { g.fillStyle = 'rgba(255,251,245,' + (fadeT / 0.25 * 0.85) + ')'; g.fillRect(0, 0, W, H); }
  cv.style.cursor = hot ? 'pointer' : 'default';
}
if (LOCAL && QS.get('daily')) { startDaily(); if (QS.get('win')) { const path = solve(cars); for (const m of path) { setCoord(cars[m[0]], m[1]); moves++; } hint = null; persist = () => {}; win(); winT = 2; } }
// Local test hook: ?level=N opens a level, &solve=K plays the first K solution moves, &win=1 finishes it.
if (LOCAL && QS.get('level')) {
  startLevel(+QS.get('level'));
  const path = solve(cars), k = QS.get('win') ? path.length : +QS.get('solve') || 0;
  for (let i = 0; i < k; i++) { setCoord(cars[path[i][0]], path[i][1]); moves++; }
  hint = null;
  if (QS.get('win')) { persist = () => {}; win(); winT = 2; }
}
if (LOCAL && QS.get('coins')) { persist = () => {}; save.coins = +QS.get('coins'); }
if (LOCAL && QS.get('screen')) { page = +QS.get('page') || 0; screen = QS.get('screen'); }
// Local self-test (tools/smoke_test.py): the hint solver must reproduce every level's recorded minimum.
if (LOCAL && QS.get('selftest')) document.title = 'selftest:' + LEVELS.length + ':' + LEVELS.map((b, i) => solve(parse(b)).length === PAR[i] ? 0 : i + 1).filter(Boolean).join(',');
// Local trailer renderer: solves one level on screen, then shows a few moves in each other world,
// at a fixed 30 fps, and posts each frame to the local capture server.
async function demoLoop() {
  const dt = 1 / 30, tour = [4, 30, 50, 70, 90];
  let n = 0, mt = 0, li = 0, played = 0, path = null;
  persist = () => {};
  const snap = async () => {
    update(dt); draw();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.93));
    await fetch('/frame?v=' + DEMO + '&n=' + String(n++).padStart(4, '0'), { method: 'POST', body: blob });
  };
  const open = k => { startLevel(tour[k]); path = solve(cars); played = 0; mt = -0.3; };
  screen = 'menu';
  for (let i = 0; i < 40; i++) await snap();
  open(0);
  while (n < 720) {
    mt += dt;
    if (screen === 'game' && !slide && exitT < 0 && mt > 0.4 && path.length) {
      if (li > 0 && played >= 6) { if (++li >= tour.length) break; open(li); continue; }
      mt = 0; played++;
      const m = path.shift(), from = coord(cars[m[0]]);
      slide = { car: m[0], from, to: m[1], t: 0, then: () => afterMove(m[0], from) };
    }
    if (screen === 'win' && winT > 2) { if (++li >= tour.length) break; open(li); }
    await snap();
  }
  for (let i = 0; i < 12; i++) await snap();
  await fetch('/frame?v=' + DEMO + '&n=done', { method: 'POST', body: 'x' });
}
// Local cover renderer (?demo=cover&w=&h=): one still of a busy board under the title, posted as a PNG.
async function coverShot() {
  const wide = W > H * 1.2, w = WORLDS[0];
  u = Math.min(W, H) / (wide ? 100 : 110); x0 = y0 = 0; persist = () => {};
  level = 9; cars = parse(LEVELS[8]); specs = cars.map((c, i) => specFor(i)); screen = 'game'; time = 0.4;
  const size = wide ? H * 0.74 : Math.min(W * 0.8, H * 0.6);
  still = { x: wide ? W - size - H * 0.2 : (W - size) / 2 - W * 0.02, y: wide ? H * 0.13 : H - size - H * 0.07, cell: size / N, size };
  const b = still, c = b.cell, ey = b.y + EXIT_ROW * c;
  ground(w);
  road(w, b.x + b.size + u * 2, ey + c * 0.04, W, c * 0.92, false);
  scatter('cover', 3, [[b.x - u * 5, b.y - u * 5, size + u * 10, size + u * 10], [b.x + size, ey - u * 2, W, c + u * 4]]);
  drawDecor(w);
  const sh2 = wide ? g.createLinearGradient(0, 0, b.x, 0) : g.createLinearGradient(0, 0, 0, b.y);
  sh2.addColorStop(0, 'rgba(12,28,22,.62)'); sh2.addColorStop(1, 'rgba(12,28,22,0)');
  g.fillStyle = sh2; g.fillRect(0, 0, wide ? b.x : W, wide ? H : b.y);
  drawBoard();
  if (wide) {
    const cx = (b.x - u * 3) / 2;
    head('Car Jam', cx, H * 0.27, H * 0.165, '#FFFFFF');
    tag('Escape', cx, H * 0.43, H * 0.12, '#FFFFFF');
    g.save(); g.translate(cx, H * 0.72); g.rotate(-0.14);
    drawCar(-H * 0.36, -H * 0.02, H * 0.3, H * 0.15, true, LOOKS[2]);
    drawCar(-H * 0.02, -H * 0.19, H * 0.42, H * 0.21, true, Object.assign({ me: true }, SKINS[0]));
    g.restore();
  } else {
    const top = b.y - u * 3;
    head('Car Jam', W / 2, top * 0.4, Math.min(W * 0.19, top * 0.42), '#FFFFFF');
    tag('Escape', W / 2, top * 0.76, Math.min(W * 0.13, top * 0.29), '#FFFFFF');
  }
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  await fetch('/frame?v=' + DEMO + '-' + W + 'x' + H + '&n=cover&ext=png', { method: 'POST', body: blob });
  await fetch('/frame?v=' + DEMO + '-' + W + 'x' + H + '&n=done', { method: 'POST', body: 'x' });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!adPlaying) update(dt);
  musicTick();
  draw();
  requestAnimationFrame(frame);
}
if (DEMO === 'cover') coverShot(); else if (DEMO) demoLoop(); else requestAnimationFrame(frame);
})();
