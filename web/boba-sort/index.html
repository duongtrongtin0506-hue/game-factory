// No SDK and no ads when opened from disk or a local test server.

// Rewarded ads come first: the player asked for them, so they are never held back. Midgame ads
// are skipped when any ad ended less than this many ms ago.
const MIDGAME_GAP = 60000;

  clearTimeout(adTimer); adPlaying = false; adEnd = Date.now();
  const f = adDone; adDone = null;
  if (f) f(ok !== false);
}

  const s = document.createElement('script');

}

  if (e.name === 'SDK_GAME_PAUSE') { clearTimeout(adTimer); adPlaying = true; }            // ad on screen: freeze + mute
  else if (e.name === 'SDK_REWARDED_WATCH_COMPLETE') rewardSeen = true;

// key also goes to the portal; on a fresh device the portal copy is restored once and the page reloads so the
// game starts from it. get(key) resolves to the portal's copy, put(key, value) stores one.
function mirrorSave(get, put, ready) {
  const key = typeof SAVE_KEY === 'string' ? SAVE_KEY : '';
  if (!key) return ready();
  try {
    const set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) { set.call(this, k, v); if (k === key) { try { put(k, v); } catch (e) {} } };
  } catch (e) {}
  Promise.resolve().then(() => get(key)).then(data => {
    const cloud = data ? (typeof data === 'string' ? data : JSON.stringify(data)) : '';
    let local = '', again = '';
    try { local = localStorage.getItem(key) || ''; again = sessionStorage.getItem(key + '.restored') || ''; } catch (e) {}
    if (cloud && !local && !again) {
      try { sessionStorage.setItem(key + '.restored', '1'); localStorage.setItem(key, cloud); location.reload(); return; } catch (e) {}
    }
    if (local && !cloud) { try { put(key, local); } catch (e) {} }
    ready();
  }).catch(ready);
}

    if (!ok) return done(type !== 'rewarded');
    adDone = done; adTimer = setTimeout(() => finishAd(type !== 'rewarded'), 4000);

function isDone(tubes) { return tubes.every(t => t.length === 0 || (t.length === CAP && uniform(t))); }
function legal(tubes, a, b) {
  if (a === b || !tubes[a].length || tubes[b].length >= CAP) return false;
  return !tubes[b].length || tubes[b][tubes[b].length - 1] === tubes[a][tubes[a].length - 1];

// Depth-first solver with a node budget. Returns a list of [from, to] moves, or null.
function solve(start, budget) {
  const t = start.map(x => x.slice()), seen = new Set(), path = [];
  let nodes = 0;
  function dfs() {
    if (isDone(t)) return true;
    if (++nodes > budget) return false;
    const key = t.map(x => x.join(',')).sort().join('|');
    if (seen.has(key)) return false;
    seen.add(key);
    const moves = [];
    for (let a = 0; a < t.length; a++) {
      const A = t[a];
      if (!A.length || (A.length === CAP && uniform(A))) continue;
      let usedEmpty = false;
      for (let b = 0; b < t.length; b++) {
        if (!legal(t, a, b)) continue;
        if (t[b].length) moves.push([a, b, 0]);
        else if (!usedEmpty && !uniform(A)) { usedEmpty = true; moves.push([a, b, 1]); }
      }
    }
    moves.sort((m, n) => m[2] - n[2]);
    for (const m of moves) {
      t[m[1]].push(t[m[0]].pop()); path.push([m[0], m[1]]);
      if (dfs()) return true;
      path.pop(); t[m[0]].push(t[m[1]].pop());
      if (nodes > budget) return false;
    }
    return false;
  }
  return dfs() ? path : null;
}

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  if (DEMO) { W = +QS.get('w') || W; H = +QS.get('h') || H; dpr = 1; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  land = W > H * 1.15;
  sw = land ? 160 : 100; sh = land ? 100 : 160;
  u = Math.min(W / sw, H / sh);
  x0 = (W - sw * u) / 2; y0 = (H - sh * u) / 2;
}
window.addEventListener('resize', resize);
resize();
const X = v => x0 + v * u, Y = v => y0 + v * u;

// ---- Drawing helpers
// Design language (THIET-KE.md): warm paper, white cards, one forest accent; serif headline, sans body, mono label.
const C = { page: '#FFFBF5', card: '#FFFFFF', line: '#E8E0D5', text: '#1A1A1A', soft: '#8B7E6F', accent: '#2B4A3B' };
const HEAD = '"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
const MONO = 'ui-monospace,Menlo,Consolas,monospace';
function label(str, x, y, size, color, align, font, weight) {
  g.font = (weight || 500) + ' ' + size + 'px ' + (font || FONT);
  g.textAlign = align || 'center'; g.textBaseline = 'middle';
  g.fillStyle = color; g.fillText(str, x, y);
}
const head = (str, x, y, size, color, align) => label(str, x, y, size, color || C.text, align, HEAD, 400);
function tag(str, x, y, size, color, align) {
  if ('letterSpacing' in g) g.letterSpacing = (size * 0.08) + 'px';
  label(str.toUpperCase(), x, y, size, color || C.soft, align, MONO, 400);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
const hair = () => Math.max(1, u * 0.25);
function card(x, y, w, h, r) {

  g.fillStyle = C.card; rrect(x, y, w, h, r); g.fill(); g.restore();
}
function rrect(x, y, w, h, r) {

  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function star(x, y, r, color) {
  g.beginPath();

    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }

}
function pearl(x, y, r, c) {
  const col = FLAVOURS[c];

  g.lineWidth = r * 0.1; g.strokeStyle = 'rgba(60,30,40,.35)'; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(x - r * 0.35, y - r * 0.42, r * 0.26, r * 0.16, -0.6, 0, TAU); g.fill();
  const ink = c === 7 || c === 3 ? '#5a3a2a' : '#fff';
  g.fillStyle = ink;
  g.beginPath(); g.arc(x - r * 0.3, y + r * 0.02, r * 0.1, 0, TAU); g.arc(x + r * 0.3, y + r * 0.02, r * 0.1, 0, TAU); g.fill();
  g.strokeStyle = ink; g.lineWidth = r * 0.09; g.lineCap = 'round';

}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = u * (15 + Math.random() * 45);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - u * 20, life: 0.6 + Math.random() * 0.4, color, size: u * (0.6 + Math.random() * 1.2) });

}
// The primary button is the one accent on a screen; every other button is a white pill with a hairline.
function button(str, cx, cy, w, h, primary, action, size) {
  btns.push({ x: cx - w / 2, y: cy - h / 2, w, h, action });
  rrect(cx - w / 2, cy - h / 2, w, h, h / 2);
  if (primary) { g.fillStyle = C.accent; g.fill(); }
  else { g.fillStyle = C.card; g.fill(); g.lineWidth = hair(); g.strokeStyle = C.line; g.stroke(); }
  label(str, cx, cy + h * 0.02, size || h * 0.34, primary ? '#FFFFFF' : C.text);
}
function roundBtn(str, x, y, action, off) {
  const r = u * 5;

  g.fillStyle = C.card; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.lineWidth = hair(); g.strokeStyle = C.line; g.stroke();
  label(str, x, y - u * 0.3, u * 5, off ? C.soft : C.text, 'center', FONT, 400);
  if (off) { g.strokeStyle = C.soft; g.lineWidth = u * 0.6; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - r * 0.5, y + r * 0.5); g.lineTo(x + r * 0.5, y - r * 0.5); g.stroke(); }
}
function cup(x, y, s) {                                // boba cup logo
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(x - s * 0.5, y - s * 0.55); g.lineTo(x + s * 0.5, y - s * 0.55); g.lineTo(x + s * 0.36, y + s * 0.7); g.lineTo(x - s * 0.36, y + s * 0.7); g.closePath(); g.fill(); g.lineWidth = hair(); g.strokeStyle = C.line; g.stroke();
  g.fillStyle = '#f3c9a0'; g.beginPath(); g.moveTo(x - s * 0.45, y - s * 0.2); g.lineTo(x + s * 0.45, y - s * 0.2); g.lineTo(x + s * 0.36, y + s * 0.7); g.lineTo(x - s * 0.36, y + s * 0.7); g.closePath(); g.fill();
  g.fillStyle = '#ff7aa8'; rrect(x - s * 0.58, y - s * 0.7, s * 1.16, s * 0.18, s * 0.08); g.fill();
  g.strokeStyle = '#4dc3ff'; g.lineWidth = s * 0.1; g.lineCap = 'round'; g.beginPath(); g.moveTo(x + s * 0.12, y + s * 0.3); g.lineTo(x + s * 0.34, y - s * 1.05); g.stroke();
  [[-0.2, 0.5], [0.05, 0.56], [0.24, 0.48], [-0.08, 0.36], [0.16, 0.34]].forEach(p => pearl(x + p[0] * s, y + p[1] * s, s * 0.1, 0));
}

// ---- Board geometry
function geo(i) {
  const n = tubes.length;
  const rows = !land && n > 5 ? 2 : 1, cols = Math.ceil(n / rows);   // landscape fits all cups in one row
  const ax = 6, aw = sw - 12, ay = 22, ah = sh - 22 - 20;
  const cellW = aw / cols, cellH = ah / rows;
  const d = Math.min(cellW * 0.6, cellH * 0.8 / (CAP + 1.45), 13);
  const row = Math.floor(i / cols), inRow = row === rows - 1 ? n - cols * (rows - 1) : cols;
  const cx = ax + (aw - inRow * cellW) / 2 + (i % cols + 0.5) * cellW;
  const bottom = ay + row * cellH + cellH / 2 + (d * (CAP + 1.45)) / 2;
  return { cx: X(cx), bottom: Y(bottom), d: d * u, cellW: cellW * u, top: Y(bottom) - d * u * (CAP + 0.3) };
}
function ballY(p, k) { return p.bottom - p.d * 0.2 - p.d * (k + 0.5); }
function tubeAt(x, y) {
  for (let i = 0; i < tubes.length; i++) {
    const p = geo(i);
    if (Math.abs(x - p.cx) < p.cellW / 2 && y > p.top - p.d * 1.6 && y < p.bottom + p.d * 0.4) return i;
  }
  return -1;
}

// ---- Game flow
// Daily challenge: one level a day, the same for everyone, picked from the date. Playing it on consecutive days builds a streak.
let daily = false;
function dayKey(back) { const d = new Date(Date.now() - (back || 0) * 864e5); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function dailyLevel() { return 21 + (Math.imul(dayKey(), 2654435761) >>> 0) % (LEVELS.length - 20); }
const dailyDone = () => save.dailyDay === dayKey();
function startDaily() { startLevel(dailyLevel()); daily = true; }
const again = () => { const d = daily; startLevel(level); daily = d; };
function startLevel(n) {
  daily = false;
  level = n; tubes = LEVELS[n - 1].split('|').map(t => [...t].map(Number)); solution = solve(tubes, 40000);
  moves = 0; sel = -1; undo = []; undoLeft = 5; anim = null; doneFlash = []; parts = [];
  screen = 'game'; gameplay(true);
}
function finished(i) { return tubes[i].length === CAP && uniform(tubes[i]); }
function doMove(a, b, isUndo) {
  const pa = geo(a), pb = geo(b), c = tubes[a].pop();
  const from = { x: pa.cx, y: sel === a ? pa.top - pa.d * 0.7 : ballY(pa, tubes[a].length) };
  const to = { x: pb.cx, y: ballY(pb, tubes[b].length) };
  sel = -1;
  anim = { c, from, to, lift: Math.min(pa.top, pb.top) - pa.d * 0.7, t: 0, dur: 0.22, done() {
    tubes[b].push(c); sfx.drop();
    if (!isUndo) {
      moves++; undo.push([a, b]);
      if (finished(b)) { sfx.tube(); doneFlash[b] = 1; burst(pb.cx, pb.top, FLAVOURS[c], 22); }
      if (isDone(tubes)) win();
    }
  } };
}
function win() {
  const balls = tubes.reduce((k, t) => k + t.length, 0);
  earned = moves <= Math.min(solution.length, Math.round(balls * 1.6)) ? 3 : moves <= Math.round(balls * 2.3) ? 2 : 1;
  if (daily) {   // counts once a day; stars and unlocks belong to the normal levels
    if (!dailyDone()) { save.streak = save.dailyDay === dayKey(1) ? save.streak + 1 : 1; save.dailyDay = dayKey(); }
  } else {
    save.stars[level] = Math.max(save.stars[level] || 0, earned);
    if (level < LEVELS.length) save.unlocked = Math.max(save.unlocked, level + 1);
  }
  persist();
  screen = 'win'; winT = 0; sfx.win(); gameplay(false);
  for (let i = 0; i < 40; i++) burst(X(sw * Math.random()), Y(sh * 0.3 * Math.random()), FLAVOURS[1 + i % 6], 1);
}
function tapTube(i) {
  // A tap during a move finishes that move at once, so fast players are never ignored.
  if (anim) { const a = anim; anim = null; a.done(); if (screen !== 'game') return; }
  if (sel < 0) {
    if (tubes[i].length && !finished(i)) { sel = i; sfx.pick(); }
    return;
  }
  if (i === sel) { sel = -1; return; }
  if (legal(tubes, sel, i)) { doMove(sel, i); return; }

  if (tubes[i].length && !finished(i)) sel = i; else sel = -1;
}
function undoMove() {
  if (anim || !undo.length) return;
  if (undoLeft <= 0) { showAd('rewarded', ok => { if (ok) undoLeft = 5; }); return; }
  const m = undo.pop();
  undoLeft--; moves = Math.max(0, moves - 1); sel = -1;

}
function nextLevel() {
  const go = () => startLevel(Math.min(LEVELS.length, level + 1));
  if (level % 2 === 0) showAd('midgame', go); else go();   // an ad break every second level
}

// ---- Screens
function background() { g.fillStyle = C.page; g.fillRect(0, 0, W, H); }
function drawMenu() {
  const cx = X(sw / 2), hs = u * (land ? 40 : 56), hy = Y(land ? 30 : 48);
  // Hero card: the cup. PLAY is the one accent.
  card(cx - hs / 2, hy, hs, hs, u * 6);
  cup(cx, hy + hs * 0.56, hs * 0.42);
  head('Pearl Cup Sort', cx, Y(land ? 12 : 26), u * (land ? 12 : 11.5));
  tag('Sort the pearls', cx, Y(land ? 23 : 40), u * 3);
  button('Play', land ? cx - u * 33 : cx, Y(land ? 84 : 124), u * (land ? 60 : 84), u * (land ? 12 : 14), true, () => {
    if (save.unlocked === 1 && !save.stars[1]) startLevel(1); else { page = Math.floor((save.unlocked - 1) / 20); screen = 'levels'; }
  });
  button(dailyDone() ? 'Daily done  ·  ' + save.streak + ' day' + (save.streak > 1 ? 's' : '') : 'Daily challenge', land ? cx + u * 33 : cx, Y(land ? 84 : 138), u * (land ? 60 : 84), u * (land ? 12 : 10), false, startDaily, u * 3.4);
  let total = 0; for (const k in save.stars) total += save.stars[k];
  star(cx - u * 9, Y(land ? 95 : 150) - u * 0.2, u * 2, C.accent); tag(total + ' / ' + LEVELS.length * 3, cx - u * 5, Y(land ? 95 : 150), u * 2.8, C.soft, 'left');
  roundBtn('♪', X(sw - 9), Y(9), () => { save.muted = !save.muted; persist(); }, save.muted);
}
function drawLevels() {
  const cx = X(sw / 2), cols = land ? 5 : 4, rows = 20 / cols, pages = LEVELS.length / 20;
  head('Levels', cx, Y(9), u * 8);
  roundBtn('‹', X(9), Y(9), () => { screen = 'menu'; });
  const gx = land ? 30 : 8, gw = sw - gx * 2, gy = 20, gh = sh - 20 - 20;
  const cw = gw / cols, ch = gh / rows, s = Math.min(cw, ch) * 0.86 * u;
  for (let k = 0; k < 20; k++) {
    const n = page * 20 + k + 1;
    const x = X(gx + (k % cols + 0.5) * cw), y = Y(gy + (Math.floor(k / cols) + 0.5) * ch), open = n <= save.unlocked, cur = n === save.unlocked && !save.stars[n];
    if (open) card(x - s / 2, y - s / 2, s, s, u * 4);
    else { rrect(x - s / 2, y - s / 2, s, s, u * 4); g.lineWidth = hair(); g.strokeStyle = C.line; g.stroke(); }
    if (cur) { rrect(x - s / 2, y - s / 2, s, s, u * 4); g.lineWidth = u * 0.6; g.strokeStyle = C.accent; g.stroke(); }
    head(String(n), x, y - s * 0.1, s * 0.44, open ? C.text : C.line);
    const st = save.stars[n] || 0;
    if (open) for (let j = 0; j < 3; j++) star(x + (j - 1) * s * 0.22, y + s * 0.28, s * 0.085, j < st ? C.accent : C.line);
    if (open) btns.push({ x: x - s / 2, y: y - s / 2, w: s, h: s, action: () => startLevel(n) });
  }
  const by = Y(sh - 9);
  if (page > 0) roundBtn('‹', cx - u * 22, by, () => { page--; });
  tag((page + 1) + ' / ' + pages, cx, by, u * 3);
  if (page < pages - 1) roundBtn('›', cx + u * 22, by, () => { page++; });
}
function drawBoard() {
  for (let i = 0; i < tubes.length; i++) {
    const p = geo(i), w = p.d * 1.22, shake = wrong.i === i && wrong.t > 0 ? Math.sin(wrong.t * 60) * p.d * 0.08 : 0;
    const x = p.cx + shake, done = finished(i);
    g.fillStyle = C.card;
    g.beginPath(); g.moveTo(x - w / 2, p.top); g.lineTo(x - w / 2, p.bottom - w / 2);
    g.arc(x, p.bottom - w / 2, w / 2, Math.PI, 0, true); g.lineTo(x + w / 2, p.top); g.closePath(); g.fill();
    g.lineWidth = done ? u * 0.6 : hair(); g.strokeStyle = done ? C.accent : C.line; g.stroke();
    g.strokeStyle = done ? C.accent : C.line; g.lineWidth = u * 0.8; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - w / 2 - u * 0.8, p.top); g.lineTo(x + w / 2 + u * 0.8, p.top); g.stroke();
    tubes[i].forEach((c, k) => {
      const lifted = sel === i && k === tubes[i].length - 1 && !anim;
      pearl(x, lifted ? p.top - p.d * 0.7 + Math.sin(time * 8) * p.d * 0.05 : ballY(p, k), p.d * 0.46, c);
    });
    if (doneFlash[i] > 0) { g.globalAlpha = doneFlash[i]; star(x, p.top - p.d * 0.8, p.d * 0.5 * (1.4 - doneFlash[i] * 0.4), C.accent); g.globalAlpha = 1; }
  }
  if (anim) {
    const k = Math.min(1, anim.t / anim.dur), e = k * k * (3 - 2 * k);
    const x = anim.from.x + (anim.to.x - anim.from.x) * e;
    const base = anim.from.y + (anim.to.y - anim.from.y) * e, y = Math.min(base, anim.lift + (base - anim.lift) * Math.abs(2 * e - 1));

  }

  if (level === 1 && moves === 0 && !anim && screen === 'game') {
    const p = geo(sel < 0 ? solution[0][0] : solution[0][1]), ay = p.top - p.d * (sel < 0 ? 1.1 : 1.9) + Math.sin(time * 6) * u * 1.5;
    g.fillStyle = C.accent;
    g.beginPath(); g.moveTo(p.cx, ay); g.lineTo(p.cx - u * 3.2, ay - u * 4.5); g.lineTo(p.cx - u * 1.2, ay - u * 4.5);
    g.lineTo(p.cx - u * 1.2, ay - u * 9); g.lineTo(p.cx + u * 1.2, ay - u * 9); g.lineTo(p.cx + u * 1.2, ay - u * 4.5); g.lineTo(p.cx + u * 3.2, ay - u * 4.5); g.closePath(); g.fill();

}
function drawGame() {
  const cx = X(sw / 2);

  head(daily ? 'Daily' : 'Level ' + level, cx, Y(7.5), u * 7.2);
  tag('Moves ' + moves, cx, Y(15), u * 2.6);
  roundBtn('♪', X(sw - 9), Y(9), () => { save.muted = !save.muted; persist(); }, save.muted);
  drawBoard();
  const by = Y(sh - 10), canUndo = undo.length > 0;
  g.globalAlpha = canUndo ? 1 : 0.45;
  button(undoLeft > 0 ? 'Undo  ' + undoLeft : '▶  +5 undo', cx - u * 23, by, u * 40, u * 10, false, undoMove, u * 3.4);
  g.globalAlpha = 1;
  button('Restart', cx + u * 23, by, u * 40, u * 10, false, again, u * 3.4);
}
function drawWin() {
  const cx = X(sw / 2), cy = Y(sh / 2), a = Math.min(1, winT / 0.35);
  drawBoard();
  g.fillStyle = 'rgba(26,26,26,' + (0.4 * a) + ')'; g.fillRect(0, 0, W, H);
  if (winT < 0.5) return;
  const pw = u * 84, ph = u * 82;
  card(cx - pw / 2, cy - ph / 2, pw, ph, u * 6);
  tag(daily ? 'Daily challenge  ·  ' + save.streak + ' day streak' : 'Level ' + level, cx, cy - u * 33, u * 2.8);

  for (let j = 0; j < 3; j++) {
    const k = Math.max(0, Math.min(1, (winT - 0.6 - j * 0.2) / 0.2));

  else tag('All ' + LEVELS.length + ' levels done', cx, cy + u * 17, u * 3);
  button('Replay', cx - u * 17.5, cy + u * 32, u * 33, u * 10, false, again, u * 3.4);
  button('Levels', cx + u * 17.5, cy + u * 32, u * 33, u * 10, false, () => { page = Math.floor((level - 1) / 20); screen = 'levels'; }, u * 3.4);

// ---- Input
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (adPlaying) return;
  initAudio();
  const x = e.clientX, y = e.clientY;
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { sfx.click(); b.action(); return; }
  }
  if (screen === 'game') { const i = tubeAt(x, y); if (i >= 0) tapTube(i); else sel = -1; }
});
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else if (!adPlaying) ac.resume();
});

// ---- Main loop
function update(dt) {
  time += dt;
  if (anim) { anim.t += dt; if (anim.t >= anim.dur) { const a = anim; anim = null; a.done(); } }
  if (wrong.t > 0) wrong.t -= dt;
  if (screen === 'win') winT += dt;
  for (let i = 0; i < doneFlash.length; i++) if (doneFlash[i] > 0) doneFlash[i] -= dt * 1.2;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += u * 90 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function draw() {
  btns = [];
  background();
  if (screen === 'menu') drawMenu();
  else if (screen === 'levels') drawLevels();
  else if (screen === 'game') drawGame();
  else drawWin();
  for (const p of parts) {
    g.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
}
if (LOCAL && QS.get('daily')) startDaily();
// Local test hook: ?level=N opens a level, &solve=K plays the first K solution moves, &win=1 finishes it.
if (LOCAL && QS.get('level')) {
  startLevel(+QS.get('level'));
  const k = QS.get('win') ? solution.length : +QS.get('solve') || 0;
  for (let i = 0; i < k; i++) { const m = solution[i]; tubes[m[1]].push(tubes[m[0]].pop()); moves++; undo.push(m); }
  if (QS.get('win')) { win(); winT = 2; }
}
// Local test hook: ?selftest=1 puts the level count and the levels the solver above cannot finish in the page title.
if (LOCAL && QS.get('selftest')) document.title = 'selftest:' + LEVELS.length + ':' + LEVELS.map((b, i) => solve(b.split('|').map(t => [...t].map(Number)), 40000) ? 0 : i + 1).filter(Boolean).join(',');
// Local trailer renderer: solves a few levels on screen at a fixed 30 fps and posts each frame
// to the local capture server.
async function demoLoop() {
  const dt = 1 / 30, tour = [3, 14, 40];
  let n = 0, mt = 0, mi = 0, li = 0;
  persist = () => {};
  const snap = async () => {
    update(dt); draw();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.93));
    await fetch('/frame?v=' + DEMO + '&n=' + String(n++).padStart(4, '0'), { method: 'POST', body: blob });
  };
  screen = 'menu';
  for (let i = 0; i < 36; i++) await snap();
  startLevel(tour[0]);
  while (n < 516) {
    mt += dt;
    if (screen === 'game' && !anim && mt > 0.3 && mi < solution.length) {
      mt = 0;
      if (sel < 0) sel = solution[mi][0]; else { doMove(solution[mi][0], solution[mi][1]); mi++; }
    }
    if (screen === 'win' && winT > 1.7) { if (++li >= tour.length) break; startLevel(tour[li]); mi = 0; }
    await snap();
  }
  await fetch('/frame?v=' + DEMO + '&n=done', { method: 'POST', body: 'x' });
}
// Local cover renderer (?demo=cover&w=&h=): a half-sorted board under the title, posted as a PNG.
async function coverShot() {
  persist = () => {};
  startLevel(14);
  for (let i = 0; i < Math.floor(solution.length * 0.6); i++) { const m = solution[i]; tubes[m[1]].push(tubes[m[0]].pop()); moves++; }
  time = 0.4;
  background(); drawBoard();
  head('Pearl Cup Sort', X(sw / 2), Y(land ? 11 : 19), u * 11);   // portrait/square: below the top-left corner, which portals cover with a label
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  await fetch('/frame?v=' + DEMO + '-' + W + 'x' + H + '&n=cover&ext=png', { method: 'POST', body: blob });
  await fetch('/frame?v=' + DEMO + '-' + W + 'x' + H + '&n=done', { method: 'POST', body: 'x' });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!adPlaying) update(dt);
  draw();
  requestAnimationFrame(frame);
}
if (DEMO === 'cover') coverShot(); else if (DEMO) demoLoop(); else requestAnimationFrame(frame);
})();
</script>
