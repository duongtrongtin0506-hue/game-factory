<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sprout Merge</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FFFBF5;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ============================================================================
// Ads: one source for every game (web/ads.js). tools/build.py pastes this file into each game
// in place of its ADS marker and fills in PORTAL and GAME_ID for the portal being packaged:
//   'gamemonetize'      GameMonetize HTML5 SDK (GAME_ID = game hash from their dashboard)
//   'gamedistribution'  GameDistribution HTML5 SDK (GAME_ID from their dashboard)
//   'crazygames'        CrazyGames SDK v3 (no id; only works on their domain)
//   'playgama'          Playgama Bridge v2 (no id; needs playgama-bridge-config.json next to index.html)
//   'none'              no SDK, no ads (itch.io, self-hosting, local testing)
// A game calls showAd(type, done), gameplay(on) and happy(), reads adPlaying to freeze and mute
// while an ad is on screen, and may define onPortalReady() to run once the SDK is up.
// SDK calls follow the pages listed in NGHIEN-CUU.md (checked 2026-10-12) and, for Playgama, CONG.md (checked 2026-10-13).
// ============================================================================
const PORTAL = 'gamemonetize';
const GAME_ID = '';
// No SDK and no ads when opened from disk or a local test server.
const LOCAL = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
// Rewarded ads come first: the player asked for them, so they are never held back. Midgame ads
// are skipped when any ad ended less than this many ms ago.
const MIDGAME_GAP = 60000;

let adPlaying = false, adDone = null, adType = '', adTimer = 0, adEnd = 0, rewardSeen = false, cg = null, pg = null, pgPaused = false, pgAd = false;
function finishAd(ok) {
  clearTimeout(adTimer); adPlaying = false; adEnd = Date.now();
  const f = adDone; adDone = null;
  if (f) f(ok !== false);
}
function loadScript(src, id, onload) {
  const s = document.createElement('script');
  s.id = id; s.src = src; s.onload = onload || null;
  document.head.appendChild(s);
}
// GameMonetize and GameDistribution report ads through the same event names.
function portalEvent(e) {
  if (e.name === 'SDK_GAME_PAUSE') { clearTimeout(adTimer); adPlaying = true; }            // ad on screen: freeze + mute
  else if (e.name === 'SDK_REWARDED_WATCH_COMPLETE') rewardSeen = true;
  else if (e.name === 'SDK_GAME_START') finishAd(PORTAL !== 'gamedistribution' || adType !== 'rewarded' || rewardSeen);
  else if (e.name === 'SDK_READY' && typeof onPortalReady === 'function') onPortalReady();
}
if (!LOCAL && PORTAL === 'gamemonetize' && GAME_ID) {
  window.SDK_OPTIONS = { gameId: GAME_ID, onEvent: portalEvent };
  loadScript('https://api.gamemonetize.com/sdk.js', 'gamemonetize-sdk');
}
if (!LOCAL && PORTAL === 'gamedistribution' && GAME_ID) {
  window.GD_OPTIONS = { gameId: GAME_ID, onEvent: portalEvent };
  loadScript('https://html5.api.gamedistribution.com/main.min.js', 'gamedistribution-jssdk');
}
// Cloud saves (CrazyGames Data module, Playgama Bridge storage): every write to localStorage under the game's
// key also goes to the portal; on a fresh device the portal copy is restored once and the page reloads so the
// game starts from it. get(key) resolves to the portal's copy, put(key, value) stores one.
function mirrorSave(get, put, ready) {
  const key = typeof SAVE_KEY === 'string' ? SAVE_KEY : '';
  if (!key) return ready();
  try {
    const set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) { set.call(this, k, v); if (k === key) { try { put(k, v); } catch (e) {} } };
  } catch (e) {}
  Promise.resolve().then(() => get(key)).then(data => {
    const cloud = data ? (typeof data === 'string' ? data : JSON.stringify(data)) : '';
    let local = '', again = '';
    try { local = localStorage.getItem(key) || ''; again = sessionStorage.getItem(key + '.restored') || ''; } catch (e) {}
    if (cloud && !local && !again) {
      try { sessionStorage.setItem(key + '.restored', '1'); localStorage.setItem(key, cloud); location.reload(); return; } catch (e) {}
    }
    if (local && !cloud) { try { put(key, local); } catch (e) {} }
    ready();
  }).catch(ready);
}
if (!LOCAL && PORTAL === 'crazygames') {
  loadScript('https://sdk.crazygames.com/crazygames-sdk-v3.js', 'crazygames-sdk', () => {
    window.CrazyGames.SDK.init().then(() => {
      cg = window.CrazyGames.SDK;
      mirrorSave(k => cg.data.getItem(k), (k, v) => cg.data.setItem(k, v), () => { if (typeof onPortalReady === 'function') onPortalReady(); });
    }).catch(() => {});
  });
}
// Playgama Bridge: one SDK for Playgama and its partner portals. The bridge tells us when to pause and mute
// (an ad is open, the tab is hidden); progress is mirrored to the bridge storage (mirrorSave) because some of
// its portals wipe localStorage; 'game_ready' hides the portal's loading screen.
function pgState(state) {
  if (state === 'opened') { clearTimeout(adTimer); pgAd = true; adPlaying = true; }
  else if (state === 'rewarded') rewardSeen = true;
  else if (state === 'closed' || state === 'failed') { pgAd = false; adPlaying = pgPaused; finishAd(adType !== 'rewarded' || rewardSeen); }
}
function pgSave(key, value) { if (pg) { try { pg.storage.set([key], [value]).catch(() => {}); } catch (e) {} } }
if (!LOCAL && PORTAL === 'playgama') {
  loadScript('https://bridge.playgama.com/v2/stable/playgama-bridge.js', 'playgama-bridge', () => {
    const b = window.bridge;
    b.initialize().then(() => {
      pg = b;
      b.advertisement.on(b.EVENT_NAME.INTERSTITIAL_STATE_CHANGED, pgState);
      b.advertisement.on(b.EVENT_NAME.REWARDED_STATE_CHANGED, pgState);
      b.platform.on(b.EVENT_NAME.PAUSE_STATE_CHANGED, paused => { pgPaused = !!paused; adPlaying = pgPaused || pgAd; });
      mirrorSave(k => b.storage.get([k]).then(d => d && d[0]), pgSave,
        () => { b.platform.sendMessage('game_ready'); if (typeof onPortalReady === 'function') onPortalReady(); });
    }).catch(() => {});
  });
}
// type: 'midgame' | 'rewarded'. Calls done(ok) afterwards. ok is false only for a rewarded ad
// whose reward must not be given: blocked by an adblocker (CrazyGames) or not watched to the
// end (GameDistribution). With no SDK, or no ad to show, the game simply carries on.
function showAd(type, done) {
  if (adDone) return;
  if (type !== 'rewarded' && Date.now() - adEnd < MIDGAME_GAP) return done(true);
  adType = type; rewardSeen = false;
  if (pg) {
    // Carry on after 4s if no ad opens (unsupported, cooldown, no fill); a rewarded ad that never ran pays nothing.
    const ok = type === 'rewarded' ? pg.advertisement.isRewardedSupported : pg.advertisement.isInterstitialSupported;
    if (!ok) return done(type !== 'rewarded');
    adDone = done; adTimer = setTimeout(() => finishAd(type !== 'rewarded'), 4000);
    try { if (type === 'rewarded') pg.advertisement.showRewarded('reward'); else pg.advertisement.showInterstitial('level_completed'); } catch (e) { finishAd(type !== 'rewarded'); }
  } else if (cg) {
    adDone = done;
    cg.ad.requestAd(type, {
      adStarted: () => { adPlaying = true; },
      adFinished: () => finishAd(true),
      adError: e => finishAd(!(type === 'rewarded' && e && e.code === 'adblock'))
    });
  } else if (window.gdsdk && window.gdsdk.showAd) {
    // Carry on after 4s if no ad starts (no fill / blocked); a rewarded ad that never ran pays nothing.
    adDone = done; adTimer = setTimeout(() => finishAd(type !== 'rewarded'), 4000);
    const p = type === 'rewarded' ? window.gdsdk.showAd('rewarded') : window.gdsdk.showAd();
    if (p && p.catch) p.catch(() => { if (!adPlaying) finishAd(type !== 'rewarded'); });
  } else if (window.sdk && window.sdk.showBanner) {
    // GameMonetize has one ad format; carry on after 4s if no ad starts.
    adDone = done; adTimer = setTimeout(finishAd, 4000);
    window.sdk.showBanner();
  } else done(true);
}
// Tells the portal when real gameplay starts and stops (CrazyGames requirement).
function gameplay(on) {
  if (!cg) return;
  try { if (on) cg.game.gameplayStart(); else cg.game.gameplayStop(); } catch (e) {}
}
// A big moment (three stars, a new best): CrazyGames may celebrate it.
function happy() {
  if (cg) { try { cg.game.happytime(); } catch (e) {} }
}
// Local-only helpers (?selftest=1, ?fresh=1): ignored anywhere but a local test server.
const QS = new URLSearchParams(LOCAL ? location.search : '');
const DEMO = QS.get('demo');            // local only: renders a cover or an auto-played trailer frame by frame

// ==CORE== (pure game rules: no DOM). A state S holds the 5x6 grid of tiers (0 = empty).
const COLS = 5, ROWS = 6, CELLS = COLS * ROWS, TOP = 10, MAX_SEEDS = 12, SEED_EVERY = 3, MAX_UP = 6;
const NAMES = ['', 'Seed', 'Sprout', 'Clover', 'Daisy', 'Berry', 'Orange', 'Apple', 'Pumpkin', 'Basket', 'Golden Tree'];
function newState() {
  return { grid: new Array(CELLS).fill(0), coins: 0, seeds: MAX_SEEDS, up: 0, delivered: 0, found: 1, order: 3, merges: 0, season: 0, since: 0 };
}
const empties = S => S.grid.map((t, i) => t ? -1 : i).filter(i => i >= 0);
// Each finished season (a delivered Golden Tree) adds half again to everything earned.
const boost = S => 1 + 0.5 * (S.season || 0);
const income = S => boost(S) * S.grid.reduce((a, t) => a + (t > 1 ? Math.pow(2, t - 2) * 0.5 : 0), 0);   // coins per second
const reward = S => Math.round(boost(S) * 30 * Math.pow(2, S.order - 2) * (1 + (S.delivered - (S.since || 0)) / 20));
const upCost = S => S.up >= MAX_UP ? Infinity : 150 * Math.pow(3, S.up) * Math.pow(4, S.season || 0);   // dearer every season, so saved coins do not skip it
const seedTier = (S, rnd) => 1 + Math.floor(S.up / 2) + (rnd() < 0.2 + 0.15 * (S.up % 2) ? 1 : 0);
// Orders climb one tier every three deliveries, but never ask for more than one tier above the best item found.
const nextOrder = S => Math.max(3, Math.min(TOP, S.found + 1, 3 + Math.floor((S.delivered - (S.since || 0)) / 3)));
// Delivering the Golden Tree ends the season: the garden starts over and earns more.
function seasonUp(S) {
  S.season = (S.season || 0) + 1; S.since = S.delivered; S.grid.fill(0); S.up = 0; S.found = 1; S.seeds = MAX_SEEDS; S.order = 3;
}
function spawn(S, rnd) {
  const free = empties(S);
  if (S.seeds < 1 || !free.length) return -1;
  const i = free[Math.floor(rnd() * free.length)];
  S.grid[i] = seedTier(S, rnd); S.seeds--; S.found = Math.max(S.found, S.grid[i]);
  return i;
}
// Drop the item in cell a onto cell b: same tier merges, anything else swaps places.
function move(S, a, b) {
  const t = S.grid[a];
  if (a === b || !t) return '';
  if (S.grid[b] === t && t < TOP) {
    S.grid[a] = 0; S.grid[b] = t + 1; S.merges++; S.coins += 5 * Math.pow(2, t); S.found = Math.max(S.found, t + 1);
    return 'merge';
  }
  S.grid[a] = S.grid[b]; S.grid[b] = t;
  return 'move';
}
function deliver(S, i) {
  if (S.grid[i] !== S.order) return 0;
  const r = reward(S), top = S.order === TOP;
  S.grid[i] = 0; S.coins += r; S.delivered++;
  if (top) seasonUp(S); else S.order = nextOrder(S);
  return r;
}
function sell(S, i) {
  const r = Math.pow(2, S.grid[i]);
  if (!S.grid[i]) return 0;
  S.grid[i] = 0; S.coins += r;
  return r;
}
function upgrade(S) {
  const c = upCost(S);
  if (S.coins < c) return false;
  S.coins -= c; S.up++;
  return true;
}
function pair(S) {
  for (let a = 0; a < CELLS; a++) if (S.grid[a] && S.grid[a] < TOP) for (let b = a + 1; b < CELLS; b++) if (S.grid[b] === S.grid[a]) return [a, b];
  return null;
}
// A simple player: merge, deliver, plant, sell the smallest item when the board is full. Returns problems found.
function botRun(steps) {
  let seed = 12345; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const S = newState(), bad = [];
  for (let n = 0; n < steps; n++) {
    const p = pair(S), o = S.grid.indexOf(S.order);
    if (o >= 0) { if (!deliver(S, o)) bad.push('deliver' + n); }
    else if (p) { if (move(S, p[0], p[1]) !== 'merge') bad.push('merge' + n); }
    else if (empties(S).length && S.seeds >= 1) { if (spawn(S, rnd) < 0) bad.push('spawn' + n); }
    else if (!empties(S).length) { const low = S.grid.indexOf(Math.min(...S.grid)); if (!sell(S, low)) bad.push('stuck' + n); }
    else S.seeds = MAX_SEEDS;   // out of seeds: the bag refills while the player waits
    if (S.coins >= upCost(S)) upgrade(S);
    S.coins += income(S);
    if (S.grid.some(t => t < 0 || t > TOP || t !== Math.floor(t)) || !(S.coins >= 0)) { bad.push('state' + n); break; }
  }
  if (S.found < 5 && !S.season) bad.push('slow' + S.found);
  if (S.delivered < 3) bad.push('orders' + S.delivered);
  return bad;
}
// ==/CORE==

if (LOCAL && QS.get('selftest')) document.title = 'selftest:0:' + botRun(500).join(',');

// Design language (THIET-KE.md): warm paper, white cards, one forest accent, serif headline + sans body + mono label.
const C = { page: '#FFFBF5', card: '#FFFFFF', line: '#E8E0D5', text: '#1A1A1A', soft: '#8B7E6F', accent: '#2B4A3B' };
const F = {
  head: '"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif',
  body: 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif',
  mono: 'ui-monospace,Menlo,Consolas,monospace'
};
const SAVE_KEY = 'mergeHarvest.save.v1';
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, k = 1, ox = 0, oy = 0, land = false, L = {};

let S = newState(), muted = false, lastSave = 0, away = 0, dailyDay = 0, streak = 0;
try {
  const d = QS.get('fresh') ? null : JSON.parse(localStorage.getItem(SAVE_KEY));
  if (d && d.S && d.S.grid && d.S.grid.length === CELLS) {
    Object.assign(S, d.S); muted = !!d.muted; dailyDay = d.dailyDay || 0; streak = d.streak || 0;
    const gone = Math.min(7200, Math.max(0, (Date.now() - (d.at || Date.now())) / 1000));
    S.seeds = Math.min(MAX_SEEDS, S.seeds + gone / SEED_EVERY);
    if (gone > 60) away = Math.floor(income(S) * gone * 0.5);   // coins earned while away, offered on a card
  }
} catch (e) {}
let persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ S, muted, dailyDay, streak, at: Date.now() })); } catch (e) {} };
// Daily bonus: the first order delivered each day pays extra, more on consecutive days (up to 7).
function dayKey(back) { const d = new Date(Date.now() - (back || 0) * 864e5); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
const dailyReady = () => dailyDay !== dayKey();
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];

// Sound: short synth notes, no audio files.
let ac = null;
function note(f, len, type, vol) {
  if (muted || adPlaying) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), a = ac.createGain(), t = ac.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    a.gain.setValueAtTime(vol || 0.08, t); a.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(a); a.connect(ac.destination); o.start(t); o.stop(t + len);
  } catch (e) {}
}
const chord = (fs, len) => fs.forEach((f, i) => setTimeout(() => note(f, len, 'triangle'), i * 70));

// Layout in logical units (8px grid); the canvas scales it to the window.
function layout() {
  const dpr = DEMO ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  let W0 = window.innerWidth, H0 = window.innerHeight;
  if (DEMO) { W0 = +QS.get('w') || W0; H0 = +QS.get('h') || H0; cv.style.width = W0 + 'px'; cv.style.height = H0 + 'px'; }
  W = W0; H = H0; land = W > H * 1.15;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const LW = land ? 800 : 390, LH = land ? 420 : 800;
  k = Math.min(W / LW, H / LH); ox = (W - LW * k) / 2; oy = (H - LH * k) / 2;
  const cell = land ? 55 : 62, bw = COLS * cell + 4 * 8 + 16, bh = ROWS * cell + 5 * 8 + 16;
  const px = land ? 16 + bw + 24 : 16, pw = land ? LW - px - 16 : 358;
  L = { LW, LH, dpr, cell,
    board: { x: 16, y: land ? 16 : 176, w: bw, h: bh },
    coins: { x: px, y: land ? 16 : 24 },
    mute: { x: px + pw - 40, y: land ? 16 : 24, w: 40, h: 40 },
    order: { x: px, y: 88, w: pw, h: 72 },
    strip: { x: px, y: land ? 176 : 620, w: pw, h: 32 },
    seed: { x: px, y: land ? 232 : 668, w: pw, h: 56 },
    up: { x: px, y: land ? 304 : 732, w: pw - 96, h: 44 },
    bin: { x: px + pw - 88, y: land ? 304 : 732, w: 88, h: 44 } };
  if (!land) L.board.x = (LW - bw) / 2;
}
const cellRect = i => ({ x: L.board.x + 8 + (i % COLS) * (L.cell + 8), y: L.board.y + 8 + Math.floor(i / COLS) * (L.cell + 8), w: L.cell, h: L.cell });
const inside = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

// Drawing helpers
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function card(r, radius) {
  g.save(); g.shadowColor = 'rgba(0,0,0,.06)'; g.shadowBlur = 24 * k * L.dpr; g.shadowOffsetY = 2 * k * L.dpr;
  g.fillStyle = C.card; rr(r.x, r.y, r.w, r.h, radius || 16); g.fill(); g.restore();
}
function text(s, x, y, size, color, align, font, weight) {
  g.font = (weight || 400) + ' ' + size + 'px ' + (font || F.body);
  g.fillStyle = color || C.text; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
function label(s, x, y, align, color) {
  if ('letterSpacing' in g) g.letterSpacing = '0.9px';
  text(s.toUpperCase(), x, y, 11, color || C.soft, align, F.mono);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
// Primary pill is the one accent on screen; secondary pills are white with a hairline border.
function pill(r, primary, off) {
  rr(r.x, r.y, r.w, r.h, 999);
  if (primary) { g.fillStyle = off ? C.line : C.accent; g.fill(); }
  else { g.fillStyle = C.card; g.fill(); g.lineWidth = 1; g.strokeStyle = C.line; g.stroke(); }
}
const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : String(Math.floor(n));
function circle(x, y, r, color) { g.fillStyle = color; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); }
function leaf(x, y, r, a, color) { g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = color; g.beginPath(); g.ellipse(r, 0, r, r * 0.5, 0, 0, 6.2832); g.fill(); g.restore(); }
// The ten items, flat shapes drawn in code. r is about a third of a cell.
function item(t, x, y, r) {
  const G1 = '#6FA868', G2 = '#2B7A4B';
  if (t === 1) { g.fillStyle = '#8B5E3C'; g.beginPath(); g.ellipse(x, y, r * 0.42, r * 0.6, 0.5, 0, 6.2832); g.fill(); circle(x - r * 0.1, y - r * 0.18, r * 0.12, '#B58A63'); }
  else if (t === 2) { g.fillStyle = G2; g.fillRect(x - r * 0.06, y, r * 0.12, r * 0.7); leaf(x, y, r * 0.42, -0.6, G1); leaf(x, y, r * 0.42, 3.74, G1); }
  else if (t === 3) { g.fillStyle = G2; g.fillRect(x - r * 0.06, y, r * 0.12, r * 0.8); for (let i = 0; i < 3; i++) circle(x + Math.cos(i * 2.094 - 1.571) * r * 0.36, y - r * 0.1 + Math.sin(i * 2.094 - 1.571) * r * 0.36, r * 0.36, G2); }
  else if (t === 4) { for (let i = 0; i < 6; i++) circle(x + Math.cos(i * 1.047) * r * 0.5, y + Math.sin(i * 1.047) * r * 0.5, r * 0.3, '#F2A7B8'); circle(x, y, r * 0.3, '#F2B33D'); }
  else if (t === 5) { g.fillStyle = '#D94A4A'; g.beginPath(); g.moveTo(x, y + r * 0.85); g.bezierCurveTo(x - r * 1.1, y, x - r * 0.6, y - r * 0.8, x, y - r * 0.45); g.bezierCurveTo(x + r * 0.6, y - r * 0.8, x + r * 1.1, y, x, y + r * 0.85); g.fill(); leaf(x, y - r * 0.5, r * 0.26, -0.5, G2); leaf(x, y - r * 0.5, r * 0.26, 3.64, G2); for (let i = 0; i < 3; i++) circle(x + (i - 1) * r * 0.3, y + (i % 2) * r * 0.25, r * 0.06, '#FFE3DA'); }
  else if (t === 6) { circle(x, y, r * 0.8, '#F28C28'); circle(x - r * 0.25, y - r * 0.28, r * 0.16, '#F7B267'); leaf(x, y - r * 0.8, r * 0.26, -0.4, G2); }
  else if (t === 7) { circle(x - r * 0.28, y + r * 0.05, r * 0.62, '#C8372D'); circle(x + r * 0.28, y + r * 0.05, r * 0.62, '#C8372D'); g.fillStyle = '#5A3A22'; g.fillRect(x - r * 0.05, y - r * 0.85, r * 0.1, r * 0.4); leaf(x, y - r * 0.65, r * 0.3, -0.3, G1); }
  else if (t === 8) { for (const dx of [-0.5, 0.5, 0]) { g.fillStyle = dx ? '#D96F12' : '#EE8A22'; g.beginPath(); g.ellipse(x + dx * r, y + r * 0.1, r * 0.48, r * 0.7, 0, 0, 6.2832); g.fill(); } g.fillStyle = G2; g.fillRect(x - r * 0.08, y - r * 0.85, r * 0.16, r * 0.3); }
  else if (t === 9) { circle(x - r * 0.35, y - r * 0.2, r * 0.32, '#C8372D'); circle(x + r * 0.05, y - r * 0.3, r * 0.34, '#F28C28'); circle(x + r * 0.42, y - r * 0.15, r * 0.28, '#6FA868'); g.fillStyle = '#B5803E'; g.beginPath(); g.moveTo(x - r * 0.85, y - r * 0.05); g.lineTo(x + r * 0.85, y - r * 0.05); g.lineTo(x + r * 0.6, y + r * 0.8); g.lineTo(x - r * 0.6, y + r * 0.8); g.closePath(); g.fill(); g.fillStyle = '#9A6A2E'; g.fillRect(x - r * 0.85, y - r * 0.05, r * 1.7, r * 0.18); }
  else { g.fillStyle = '#8B5E3C'; g.fillRect(x - r * 0.1, y + r * 0.1, r * 0.2, r * 0.8); circle(x, y - r * 0.2, r * 0.62, '#D9A520'); circle(x - r * 0.42, y + r * 0.05, r * 0.4, '#D9A520'); circle(x + r * 0.42, y + r * 0.05, r * 0.4, '#D9A520'); circle(x - r * 0.15, y - r * 0.35, r * 0.14, '#F3D572'); }
}

// Live state of the screen
let drag = null, fx = [], rings = [], pops = {}, toast = null, time = 0, coinsShown = S.coins, seedPulse = -9, emptyAt = 0, started = false;
function float(s, x, y) { fx.push({ s, x, y, t: 0 }); }
function center(i) { const r = cellRect(i); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }
function showFound(t) { if (t < 3) return;   // seeds and sprouts come out of the bag: no card for those
  toast = { t, at: time }; chord([523, 659, 784, 1047], 0.35); happy(); }

function plant() {
  const before = S.found, i = spawn(S, Math.random);
  if (i < 0) { note(160, 0.12, 'square', 0.04); seedPulse = time; return; }
  pops[i] = time; note(420 + S.grid[i] * 40, 0.12);
  if (S.seeds < 1) emptyAt = time;
  if (S.found > before) showFound(S.found);
  persist();
}
function drop(from, p) {
  const t = S.grid[from];
  if (inside(p, L.order)) {
    const before = S.season || 0, r = deliver(S, from);
    if (r) {
      float('+' + fmt(r), L.order.x + L.order.w / 2, L.order.y + 8); chord([659, 784, 988], 0.3);
      if (dailyReady()) {
        streak = dailyDay === dayKey(1) ? streak + 1 : 1; dailyDay = dayKey();
        const extra = Math.round(r * 0.5 * Math.min(streak, 7)); S.coins += extra;
        float('Daily +' + fmt(extra), L.order.x + L.order.w / 2, L.order.y + 32);
      }
      if ((S.season || 0) > before) { toast = { season: S.season, at: time }; chord([523, 659, 784, 1047, 1319], 0.4); happy(); }
      if (S.delivered % 4 === 0) showAd('midgame', () => {});   // a natural pause: the order card just changed
    } else note(160, 0.12, 'square', 0.04);
  } else if (inside(p, L.bin)) { const r = sell(S, from); float('+' + r, L.bin.x + L.bin.w / 2, L.bin.y); note(300, 0.1); }
  else {
    for (let i = 0; i < CELLS; i++) if (inside(p, cellRect(i))) {
      const res = move(S, from, i);
      if (res === 'merge') {
        pops[i] = time; rings.push({ x: center(i).x, y: center(i).y, t: 0 }); float('+' + fmt(5 * Math.pow(2, t)), center(i).x, center(i).y - L.cell / 2); note(520 + t * 60, 0.18, 'triangle');
        if (t + 1 === S.found && !pops['f' + (t + 1)]) { pops['f' + (t + 1)] = 1; showFound(t + 1); }
      } else if (res === 'move') note(260, 0.06);
      break;
    }
  }
  persist();
}
function tap(p) {
  if (toast && time - toast.at > 0.4) { toast = null; return; }
  if (away) {
    if (inside(p, L.awayAd)) { const n = away; away = 0; showAd('rewarded', ok => { S.coins += ok ? n * 2 : n; persist(); }); }
    else if (inside(p, L.awayOk)) { S.coins += away; away = 0; persist(); }
    return;
  }
  if (inside(p, L.mute)) { muted = !muted; persist(); return; }
  if (inside(p, L.seed)) {
    if (S.seeds < 1 && empties(S).length && time - emptyAt > 0.8) showAd('rewarded', ok => { if (ok) { S.seeds = MAX_SEEDS; persist(); } });   // empty bag: the button offers a refill
    else plant();
    return;
  }
  if (inside(p, L.up)) { if (upgrade(S)) { chord([392, 523, 659], 0.25); persist(); } else note(160, 0.12, 'square', 0.04); }
}
function point(e) { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left - ox) / k, y: (e.clientY - b.top - oy) / k }; }
cv.addEventListener('pointerdown', e => {
  if (adPlaying) return;
  if (!started) { started = true; gameplay(true); }
  const p = point(e);
  if (!toast && !away) for (let i = 0; i < CELLS; i++) if (S.grid[i] && inside(p, cellRect(i))) { drag = { from: i, x: p.x, y: p.y }; return; }
  tap(p);
});
cv.addEventListener('pointermove', e => { if (drag) { const p = point(e); drag.x = p.x; drag.y = p.y; } });
const release = e => { if (drag) { const d = drag; drag = null; drop(d.from, point(e)); } };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', () => { drag = null; });
window.addEventListener('keydown', e => { if (e.code === 'Space' && !adPlaying && !toast && !away) { e.preventDefault(); plant(); } else if (e.key === 'm' || e.key === 'M') { muted = !muted; persist(); } });

function update(dt) {
  if (adPlaying) return;
  time += dt;
  S.coins += income(S) * dt;
  S.seeds = Math.min(MAX_SEEDS, S.seeds + dt / SEED_EVERY);
  coinsShown += (S.coins - coinsShown) * Math.min(1, dt * 8);
  fx = fx.filter(f => (f.t += dt) < 0.9);
  rings = rings.filter(r => (r.t += dt) < 0.45);
}

// First-run hint without words: a soft dot shows where to tap, then where to drag.
function hint() {
  if (S.merges > 0 || drag || toast || away) return;
  const p = pair(S), a = (time % 1.6) / 1.6;
  let x, y;
  if (p) { const s = center(p[0]), e = center(p[1]), m = Math.min(1, a * 1.4); x = s.x + (e.x - s.x) * m; y = s.y + (e.y - s.y) * m; }
  else { x = L.seed.x + L.seed.w / 2; y = L.seed.y + L.seed.h / 2 + Math.sin(a * 6.2832) * 4; }
  g.save(); g.globalAlpha = 0.9 - a * 0.5; g.shadowColor = 'rgba(0,0,0,.2)'; g.shadowBlur = 16 * k * L.dpr;
  circle(x + 12, y + 12, 14, '#FFFFFF'); g.restore(); g.lineWidth = 2; g.strokeStyle = C.text; g.beginPath(); g.arc(x + 12, y + 12, 14, 0, 6.2832); g.stroke();
}

function draw() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = C.page; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(k * L.dpr, 0, 0, k * L.dpr, ox * L.dpr, oy * L.dpr);

  // Coins: the big number of the screen
  label(S.season ? 'Coins  ·  ' + SEASONS[S.season % 4] + ' ' + (Math.floor(S.season / 4) + 1) + '  ·  x' + boost(S) : 'Coins', L.coins.x, L.coins.y + 6);
  text(fmt(coinsShown), L.coins.x, L.coins.y + 34, 40, C.text, 'left', F.head);
  const inc = income(S); if (inc > 0) text('+' + (inc < 10 ? inc.toFixed(1) : fmt(inc)) + ' / sec', L.coins.x + g.measureText(fmt(coinsShown)).width + 12, L.coins.y + 38, 14, C.soft);
  pill(L.mute); const mx = L.mute.x + 20, my = L.mute.y + 20;
  g.fillStyle = C.text; g.beginPath(); g.moveTo(mx - 8, my - 3); g.lineTo(mx - 3, my - 3); g.lineTo(mx + 3, my - 8); g.lineTo(mx + 3, my + 8); g.lineTo(mx - 3, my + 3); g.lineTo(mx - 8, my + 3); g.closePath(); g.fill();
  if (muted) { g.lineWidth = 2; g.strokeStyle = C.text; g.beginPath(); g.moveTo(mx - 9, my + 9); g.lineTo(mx + 9, my - 9); g.stroke(); }

  // Order card
  const o = L.order, have = S.grid.includes(S.order);
  card(o); if (have) { g.lineWidth = 2; g.strokeStyle = C.accent; rr(o.x + 1, o.y + 1, o.w - 2, o.h - 2, 15); g.stroke(); }
  rr(o.x + 8, o.y + 8, 56, 56, 8); g.fillStyle = C.page; g.fill(); item(S.order, o.x + 36, o.y + 36, 20);
  label('Order ' + (S.delivered + 1) + (dailyReady() ? '  ·  daily bonus' : ''), o.x + 80, o.y + 24);
  text(NAMES[S.order], o.x + 80, o.y + 46, 15, C.text);
  text('+' + fmt(reward(S)), o.x + o.w - 16, o.y + 36, 28, C.text, 'right', F.head);

  // Board
  card(L.board);
  for (let i = 0; i < CELLS; i++) {
    const r = cellRect(i), t = S.grid[i];
    rr(r.x, r.y, r.w, r.h, 8); g.fillStyle = C.page; g.fill();
    if (drag && drag.from !== i && t === S.grid[drag.from] && t < TOP) { g.lineWidth = 2; g.strokeStyle = C.accent; g.stroke(); }
    if (t && !(drag && drag.from === i)) {
      const age = time - (pops[i] || -9), s = age < 0.25 ? 1 + Math.sin(age / 0.25 * 3.1416) * 0.25 : 1;
      item(t, r.x + r.w / 2, r.y + r.h / 2, L.cell * 0.34 * s);
    }
  }

  // Collection strip: the ten items, found ones in colour
  const st = L.strip, step = st.w / TOP;
  for (let t = 1; t <= TOP; t++) {
    const x = st.x + step * (t - 0.5), y = st.y + st.h / 2;
    if (t <= S.found) item(t, x, y, 10); else circle(x, y, 4, C.line);
  }

  // Seed button (the single accent), upgrade and sell pills
  const sd = L.seed, full = !empties(S).length, out = S.seeds < 1 && time - emptyAt > 0.8, sway = time - seedPulse < 0.3 ? Math.sin((time - seedPulse) * 40) * 3 : 0;
  g.save(); g.translate(sway, 0); pill(sd, true, full);
  text(full ? 'Board full' : out ? 'Refill seeds  ▶' : 'Plant seed', sd.x + sd.w / 2 - 24, sd.y + sd.h / 2, 15, full ? C.soft : '#FFFFFF', 'center', F.body, 500);
  if ('letterSpacing' in g) g.letterSpacing = '0.9px';
  text(Math.floor(S.seeds) + ' / ' + MAX_SEEDS, sd.x + sd.w - 24, sd.y + sd.h / 2, 11, full ? C.soft : 'rgba(255,255,255,.7)', 'right', F.mono);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  g.restore();
  const up = L.up, cost = upCost(S);
  pill(up); label(S.up >= MAX_UP ? 'Seeds maxed' : 'Better seeds', up.x + 24, up.y + up.h / 2);
  if (S.up < MAX_UP) text(fmt(cost), up.x + up.w - 24, up.y + up.h / 2, 15, S.coins >= cost ? C.text : C.soft, 'right');
  pill(L.bin); if (drag && inside(drag, L.bin)) { g.lineWidth = 2; g.strokeStyle = C.accent; g.stroke(); }
  label('Sell', L.bin.x + L.bin.w / 2, L.bin.y + L.bin.h / 2, 'center');

  for (const r of rings) { g.globalAlpha = 0.5 * (1 - r.t / 0.45); g.lineWidth = 3; g.strokeStyle = C.accent; g.beginPath(); g.arc(r.x, r.y, L.cell * (0.3 + r.t * 1.2), 0, 6.2832); g.stroke(); g.globalAlpha = 1; }
  hint();
  if (drag) item(S.grid[drag.from], drag.x, drag.y - 8, L.cell * 0.42);
  for (const f of fx) { g.globalAlpha = 1 - f.t / 0.9; text(f.s, f.x, f.y - f.t * 32, 15, C.accent, 'center', F.body, 500); g.globalAlpha = 1; }

  // New item card: the one headline moment
  if (toast || away) {
    g.fillStyle = 'rgba(26,26,26,.32)'; g.fillRect(-ox / k, -oy / k, W / k, H / k);
    const w = 294, h = toast ? 264 : 248, r = { x: (L.LW - w) / 2, y: (L.LH - h) / 2, w, h }; card(r, 24);
    const cx = r.x + w / 2;
    if (toast && toast.season) {
      label('New season', cx, r.y + 32, 'center'); item(TOP, cx, r.y + 112, 48);
      text(SEASONS[toast.season % 4], cx, r.y + 196, 40, C.text, 'center', F.head);
      label('All coins x' + boost(S), cx, r.y + 236, 'center');
      if (time - toast.at > 6) toast = null;
    } else if (toast) {
      label('New item', cx, r.y + 32, 'center'); item(toast.t, cx, r.y + 112, 48);
      text(NAMES[toast.t], cx, r.y + 204, 40, C.text, 'center', F.head);
      if (time - toast.at > 4) toast = null;
    } else {
      label('While you were away', cx, r.y + 32, 'center');
      text('+' + fmt(away), cx, r.y + 88, 48, C.text, 'center', F.head);
      L.awayAd = { x: r.x + 24, y: r.y + 136, w: w - 48, h: 48 }; L.awayOk = { x: r.x + 24, y: r.y + 192, w: w - 48, h: 40 };
      pill(L.awayAd, true); text('Double it  ▶', cx, L.awayAd.y + 24, 15, '#FFFFFF', 'center', F.body, 500);
      label('Collect', cx, L.awayOk.y + 20, 'center');
    }
  }
}

// Local cover renderer (?demo=cover&w=&h=): one big basket, the smaller items around it, the title on top.
async function post(name, blob) { await fetch('/frame?v=' + DEMO + (name === 'cover' || name === 'coverdone' ? '-' + W + 'x' + H : '') + '&n=' + (name === 'coverdone' ? 'done' : name) + (name === 'cover' ? '&ext=png' : ''), { method: 'POST', body: blob }); }
async function coverShot() {
  const m = Math.min(W, H), wide = W > H * 1.2, cx = wide ? W * 0.68 : W / 2, cy = wide ? H * 0.52 : H * 0.6, R = m * (wide ? 0.34 : 0.3);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = C.page; g.fillRect(0, 0, W, H);
  g.save(); g.shadowColor = 'rgba(0,0,0,.06)'; g.shadowBlur = m * 0.06; g.shadowOffsetY = m * 0.01;
  g.fillStyle = C.card; rr(cx - R, cy - R, R * 2, R * 2, R * 0.16); g.fill(); g.restore();
  item(9, cx, cy + R * 0.05, R * 0.62);
  [[1, -0.72, -0.7], [2, 0.72, -0.72], [4, -0.74, 0.7], [6, 0.74, 0.7], [5, 0, -0.78]].forEach(q => item(q[0], cx + q[1] * R, cy + q[2] * R, R * 0.13));
  const size = wide ? Math.min(W * 0.075, H * 0.2) : Math.min(W * 0.13, H * 0.1);
  if (wide) { text('Sprout', W * 0.2, H * 0.42, size, C.text, 'center', F.head); text('Merge', W * 0.2, H * 0.42 + size * 0.95, size, C.text, 'center', F.head); }
  else text('Sprout Merge', W / 2, H * 0.14, size, C.text, 'center', F.head);
  await post('cover', await new Promise(r => cv.toBlob(r, 'image/png')));
  await post('coverdone', 'x');
}
// Local trailer renderer: a bot plants, merges and delivers on screen at a fixed 30 fps and posts each frame.
async function demoLoop() {
  const dt = 1 / 30;
  let n = 0, wait = 0;
  persist = () => {}; S = newState(); S.up = 3; S.coins = 240; away = 0; coinsShown = S.coins; dailyDay = dayKey();
  while (n < 540) {
    wait -= dt;
    if (wait <= 0 && !toast) {
      const p = pair(S), o = S.grid.indexOf(S.order), busy = CELLS - empties(S).length;
      S.seeds = MAX_SEEDS;                       // the trailer never waits for the bag
      if (busy < 9) { plant(); wait = 0.12; }    // keep the board lively before merging
      else if (o >= 0) { drop(o, { x: L.order.x + 40, y: L.order.y + 36 }); wait = 0.5; }
      else if (p) { drop(p[0], center(p[1])); wait = 0.3; }
      else if (empties(S).length) { plant(); wait = 0.16; }
      else { drop(S.grid.indexOf(Math.min(...S.grid)), { x: L.bin.x + 8, y: L.bin.y + 8 }); wait = 0.3; }
    }
    if (toast && time - toast.at > 1.2) toast = null;
    update(dt); draw();
    await post(String(n++).padStart(4, '0'), await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.93)));
  }
  await post('done', 'x');
}
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  update(dt); draw();
  if (now - lastSave > 5000) { lastSave = now; persist(); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
layout();
if (DEMO === 'cover') coverShot(); else if (DEMO) demoLoop(); else requestAnimationFrame(frame);
})();
