<script>
(() => {
'use strict';

// ============================================================================
// Ads: one source for every game (web/ads.js). tools/build.py pastes this file into each game
// in place of its ADS marker and fills in PORTAL and GAME_ID for the portal being packaged:
//   'gamemonetize'      GameMonetize HTML5 SDK (GAME_ID = game hash from their dashboard)
//   'gamedistribution'  GameDistribution HTML5 SDK (GAME_ID from their dashboard)
//   'crazygames'        CrazyGames SDK v3 (no id; only works on their domain)
//   'none'              no SDK, no ads (itch.io, self-hosting, local testing)
// A game calls showAd(type, done), gameplay(on) and happy(), reads adPlaying to freeze and mute
// while an ad is on screen, and may define onPortalReady() to run once the SDK is up.
// SDK calls follow the pages listed in NGHIEN-CUU.md (checked 2026-10-12).
// ============================================================================
const PORTAL = 'gamemonetize';
const GAME_ID = '';
// No SDK and no ads when opened from disk or a local test server.
const LOCAL = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
// Rewarded ads come first: the player asked for them, so they are never held back. Midgame ads
// are skipped when any ad ended less than this many ms ago.
const MIDGAME_GAP = 60000;

let adPlaying = false, adDone = null, adType = '', adTimer = 0, adEnd = 0, rewardSeen = false, cg = null;
function finishAd(ok) {
  clearTimeout(adTimer); adPlaying = false; adEnd = Date.now();
  const f = adDone; adDone = null;
  if (f) f(ok !== false);
}
function loadScript(src, id, onload) {
  const s = document.createElement('script');
  s.id = id; s.src = src; s.onload = onload || null;
  document.head.appendChild(s);
}
// GameMonetize and GameDistribution report ads through the same event names.
function portalEvent(e) {
  if (e.name === 'SDK_GAME_PAUSE') { clearTimeout(adTimer); adPlaying = true; }            // ad on screen: freeze + mute
  else if (e.name === 'SDK_REWARDED_WATCH_COMPLETE') rewardSeen = true;
  else if (e.name === 'SDK_GAME_START') finishAd(PORTAL !== 'gamedistribution' || adType !== 'rewarded' || rewardSeen);
  else if (e.name === 'SDK_READY' && typeof onPortalReady === 'function') onPortalReady();
}
if (!LOCAL && PORTAL === 'gamemonetize' && GAME_ID) {
  window.SDK_OPTIONS = { gameId: GAME_ID, onEvent: portalEvent };
  loadScript('https://api.gamemonetize.com/sdk.js', 'gamemonetize-sdk');
}
if (!LOCAL && PORTAL === 'gamedistribution' && GAME_ID) {
  window.GD_OPTIONS = { gameId: GAME_ID, onEvent: portalEvent };
  loadScript('https://html5.api.gamedistribution.com/main.min.js', 'gamedistribution-jssdk');
}
if (!LOCAL && PORTAL === 'crazygames') {
  loadScript('https://sdk.crazygames.com/crazygames-sdk-v3.js', 'crazygames-sdk', () => {
    window.CrazyGames.SDK.init().then(() => {
      cg = window.CrazyGames.SDK;
      if (typeof onPortalReady === 'function') onPortalReady();
    }).catch(() => {});
  });
}
// type: 'midgame' | 'rewarded'. Calls done(ok) afterwards. ok is false only for a rewarded ad
// whose reward must not be given: blocked by an adblocker (CrazyGames) or not watched to the
// end (GameDistribution). With no SDK, or no ad to show, the game simply carries on.
function showAd(type, done) {
  if (adDone) return;
  if (type !== 'rewarded' && Date.now() - adEnd < MIDGAME_GAP) return done(true);
  adType = type; rewardSeen = false;
  if (cg) {
    adDone = done;
    cg.ad.requestAd(type, {
      adStarted: () => { adPlaying = true; },
      adFinished: () => finishAd(true),
      adError: e => finishAd(!(type === 'rewarded' && e && e.code === 'adblock'))
    });
  } else if (window.gdsdk && window.gdsdk.showAd) {
    // Carry on after 4s if no ad starts (no fill / blocked); a rewarded ad that never ran pays nothing.
    adDone = done; adTimer = setTimeout(() => finishAd(type !== 'rewarded'), 4000);
    const p = type === 'rewarded' ? window.gdsdk.showAd('rewarded') : window.gdsdk.showAd();
    if (p && p.catch) p.catch(() => { if (!adPlaying) finishAd(type !== 'rewarded'); });
  } else if (window.sdk && window.sdk.showBanner) {
    // GameMonetize has one ad format; carry on after 4s if no ad starts.
    adDone = done; adTimer = setTimeout(finishAd, 4000);
    window.sdk.showBanner();
  } else done(true);
}
// Tells the portal when real gameplay starts and stops (CrazyGames requirement).
function gameplay(on) {
  if (!cg) return;
  try { if (on) cg.game.gameplayStart(); else cg.game.gameplayStop(); } catch (e) {}
}
// A big moment (three stars, a new best): CrazyGames may celebrate it.
function happy() {
  if (cg) { try { cg.game.happytime(); } catch (e) {} }
}
// Local-only helpers (?level=, ?demo=, ?selftest= ...): ignored anywhere but a local test server.
const QS = new URLSearchParams(LOCAL ? location.search : '');
const DEMO = QS.get('demo');            // local only: renders an auto-played trailer frame by frame

  '6724RRRDDLULDLULDLUUUURDRRRRULLLURRRUL',
  '6720RRRDLLLLULDDRRRDLLLDRRDLLDRRRRRULL',
  '6744RDDLULDLLLURRURURRULLLDLDLUURULURRD',
  '6730RRDLDRDLLUULLLDRRDLLDRRRRRDDLULDLUL',
  '6754DDLLLLLURRRRULLLLUUUURDDDRRURDRUUUL',

  '6743RDLDRDLLUUULURRRUULDLULDLULDDRDLDRRD',
  '6753DLUURUULDLULLLDRRDRDLLULDDRRRDDLULLD',
  '6753DDDLLLLLURRRRUULDLLLURRURRRUULDLULDLD',
  '6720RRRDLLLLULDDRRRRRDLLLLLDRRRRRDDLULLLD',
  '6704RRDLLDRRRRRULLURRULLLLLURRRULLLURRRRR',
  '6716LURRDRRRULLURRULLLDLLURULUURDRURRRDDLU',
  '6724RRRDDLULDLULDLUURULURRDRRRULLUR',
  '6724RRRDDLULDLULDLUURULURRDRURDRUUULDLU',
  '6711LURRRRRDLLLDRRRDLLLLULDDRRRRRDDLU',
  '6716LURRDRRRULLUURDRUULLLLURRRRULL',
  '6750LLLLLDRRRRRDLDRDLLUULLLDRRDLL',
  '6701URRRRRDLLLLDLDRRDLLDDRURDRRRULURUULD',
  '6713LDRDLDRRRRRUUUUUULLLLLDDRURRRDLLDRR',
  '6744RDDLULDLLLUUURDDRURULUUURRRDL',
  '6711LURRRRRDLDRDLLUULDLLDRRDDDRRULUR',
  '6750LLDRRDLLLUULLDRDLDRRRRRDLLLLLDDRUR',
  '6704DDRRULURRURDRUULLURRULLLLLDRRDDLL',
  '6733RRDLLDRRDLLLLURULLURRURRRUULDLULD',
  '6703DDDRRRRRULLLLURRRRULLLLULURUL',
  '6705DRRRRRULLLLULURRDRRRULLURRUUL',
  '6751ULLLDRRDRDLLULDLLDDDRRULURRRRDDLLU',
  '6734RRDDLULDLLLURRULLURRRRRULLLLU',
  '6726LURRDRRULURUUUULLLLLDRRDRURDDLD',
  '6725DRURDRUULLLLURRRRULLURRULLLLLD',
  '6701URRRDRURDDLLLULDLDRRRRRDLLLLDRRRRDLLLLL',
  '6705DRRULULURRDRDDRRULURUUUULLLLLDDRURDRDR'
];
// A level is a string: width, height, start column, start row (one digit each), then the sample
// line as R L D U steps. The cells that line crosses are the board, and the line is what hints
// replay. tools/oneline.py builds the levels and checks each one before it gets here.
function makeLevel(n) {
  const s = LEVELS[n - 1], step = { R: [1, 0], L: [-1, 0], D: [0, 1], U: [0, -1] };
  let x = +s[2], y = +s[3];
  const path = [[x, y]];
  for (const ch of s.slice(4)) { x += step[ch][0]; y += step[ch][1]; path.push([x, y]); }
  return { w: +s[0], h: +s[1], path };
}
// ==/CORE==

const SAVE_KEY = 'oneLine.save.v1';
const FONT = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const TAU = 6.2832;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, u = 1, sw = 100, sh = 160, x0 = 0, y0 = 0, land = false;

let save = { unlocked: 1, stars: {}, muted: false, dailyDay: 0, streak: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
let persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

let screen = 'menu';              // menu | levels | game | win
let time = 0, page = 0, btns = [], parts = [];
let level = 1, lv = null, cells = new Set(), line = [], hints = 2, hintLen = 0, used = 0, dragging = false, winT = 0, earned = 0, pulse = 0;

// ---- Audio (synthesised)
let ac = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) ac = new AC();
}
function tone(f1, f2, d, type, vol, delay) {
  if (save.muted || adPlaying || !ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), ga = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
  ga.gain.setValueAtTime(vol || 0.2, t); ga.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(ga); ga.connect(ac.destination);
  o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  step:  n => tone(300 + n * 18, 300 + n * 18, 0.06, 'sine', 0.18),
  back:  () => tone(240, 200, 0.05, 'sine', 0.12),
  win:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'triangle', 0.22, i * 0.11)),
  click: () => tone(600, 600, 0.04, 'square', 0.07)
};

// ---- Layout: a 100x160 stage in portrait, 160x100 in landscape, centred in the window.
function resize() {
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  if (DEMO) { W = +QS.get('w') || W; H = +QS.get('h') || H; dpr = 1; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  land = W > H * 1.15;
  sw = land ? 160 : 100; sh = land ? 100 : 160;
  u = Math.min(W / sw, H / sh);
  x0 = (W - sw * u) / 2; y0 = (H - sh * u) / 2;
}
window.addEventListener('resize', resize);
resize();
const X = v => x0 + v * u, Y = v => y0 + v * u;

// ---- Drawing helpers
// Design language (THIET-KE.md), night variant: near-black page, dark cards, one red accent (the line itself);
// serif headline, sans body, mono label.
const C = { page: '#0A0A0B', card: '#1A1A1A', line: '#2C2C2E', text: '#FFFBF5', soft: '#8B7E6F', accent: '#FF3B30' };
const HEAD = '"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
const MONO = 'ui-monospace,Menlo,Consolas,monospace';
function label(str, x, y, size, color, align, font, weight) {
  g.font = (weight || 500) + ' ' + size + 'px ' + (font || FONT);
  g.textAlign = align || 'center'; g.textBaseline = 'middle';
  g.fillStyle = color; g.fillText(str, x, y);
}
const head = (str, x, y, size, color, align) => label(str, x, y, size, color || C.text, align, HEAD, 400);
function tag(str, x, y, size, color, align) {
  if ('letterSpacing' in g) g.letterSpacing = (size * 0.08) + 'px';
  label(str.toUpperCase(), x, y, size, color || C.soft, align, MONO, 400);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
const hair = () => Math.max(1, u * 0.25);
function card(x, y, w, h, r) { g.fillStyle = C.card; rrect(x, y, w, h, r); g.fill(); g.lineWidth = hair(); g.strokeStyle = C.line; g.stroke(); }
function rrect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function star(x, y, r, color) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fillStyle = color; g.fill();
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = u * (15 + Math.random() * 45);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - u * 20, life: 0.6 + Math.random() * 0.4, color, size: u * (0.6 + Math.random() * 1.2) });
  }
}
// The primary button is the one accent on a screen; every other button is a dark pill with a hairline.
function button(str, cx, cy, w, h, primary, action, size) {
  btns.push({ x: cx - w / 2, y: cy - h / 2, w, h, action });
  rrect(cx - w / 2, cy - h / 2, w, h, h / 2);
  if (primary) { g.fillStyle = C.accent; g.fill(); }
  else { g.fillStyle = C.card; g.fill(); g.lineWidth = hair(); g.strokeStyle = C.line; g.stroke(); }
  label(str, cx, cy + h * 0.02, size || h * 0.34, primary ? '#FFFFFF' : C.text);
}
function roundBtn(str, x, y, action, off) {
  const r = u * 5;
  btns.push({ x: x - r, y: y - r, w: r * 2, h: r * 2, action });
  g.fillStyle = C.card; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.lineWidth = hair(); g.strokeStyle = C.line; g.stroke();
  label(str, x, y - u * 0.3, u * 5, off ? C.soft : C.text, 'center', FONT, 400);
  if (off) { g.strokeStyle = C.soft; g.lineWidth = u * 0.6; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - r * 0.5, y + r * 0.5); g.lineTo(x + r * 0.5, y - r * 0.5); g.stroke(); }
}
// The line is the accent, one colour from start to head.
function hue() { return C.accent; }

// ---- Board geometry
function geo() {
  const ax = land ? 12 : 6, aw = land ? 96 : 88, ay = land ? 19 : 24, ah = land ? 76 : 104;
  const cell = Math.min(aw / lv.w, ah / lv.h, land ? 15 : 22) * u;
  return { cell, bx: X(ax + aw / 2) - lv.w * cell / 2, by: Y(ay + ah / 2) - lv.h * cell / 2 };
}
const ck = (x, y) => y * 10 + x;

// ---- Game flow
// Daily challenge: one level a day, the same for everyone, picked from the date. Playing it on consecutive days builds a streak.
let daily = false;
function dayKey(back) { const d = new Date(Date.now() - (back || 0) * 864e5); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function dailyLevel() { return 21 + (Math.imul(dayKey(), 2654435761) >>> 0) % (LEVELS.length - 20); }
const dailyDone = () => save.dailyDay === dayKey();
function startDaily() { startLevel(dailyLevel()); daily = true; }
const again = () => { const d = daily; startLevel(level); daily = d; };
function startLevel(n) {
  daily = false;
  level = n; lv = makeLevel(n);
  cells = new Set(lv.path.map(p => ck(p[0], p[1])));
  line = [lv.path[0]]; hints = 2; hintLen = 0; used = 0; dragging = false; parts = [];
  screen = 'game'; gameplay(true);
}
function inLine(x, y) { return line.findIndex(p => p[0] === x && p[1] === y); }
// Called with the cell under the finger: extend the line into a free neighbour, or step back.
function visit(x, y) {
  if (!cells.has(ck(x, y))) return;
  const head = line[line.length - 1], i = inLine(x, y);
  if (i >= 0) {
    if (i === line.length - 2) { line.pop(); sfx.back(); }
    return;
  }
  if (Math.abs(head[0] - x) + Math.abs(head[1] - y) !== 1) return;
  line.push([x, y]); pulse = 1; sfx.step(line.length);
  if (line.length === cells.size) win();
}
function rewind() { if (line.length > 1) { line = [lv.path[0]]; sfx.back(); } }
// A hint redraws the line along the known solution, a few cells further than last time.
function useHint() {
  const give = () => {
    used++;
    let same = 0;
    while (same < line.length && line[same][0] === lv.path[same][0] && line[same][1] === lv.path[same][1]) same++;
    hintLen = Math.min(lv.path.length - 1, Math.max(same, hintLen) + Math.max(3, Math.ceil(lv.path.length / 5)));
    line = lv.path.slice(0, hintLen).map(p => p.slice());
    sfx.step(line.length);
  };
  if (hints > 0) { hints--; give(); } else showAd('rewarded', ok => { if (ok) give(); });
}
function win() {
  earned = used === 0 ? 3 : used === 1 ? 2 : 1;
  if (daily) {   // counts once a day; stars and unlocks belong to the normal levels
    if (!dailyDone()) { save.streak = save.dailyDay === dayKey(1) ? save.streak + 1 : 1; save.dailyDay = dayKey(); }
  } else {
    save.stars[level] = Math.max(save.stars[level] || 0, earned);
    if (level < LEVELS.length) save.unlocked = Math.max(save.unlocked, level + 1);
  }
  persist();
  dragging = false; screen = 'win'; winT = 0; sfx.win(); gameplay(false);
  for (let i = 0; i < 40; i++) burst(X(sw * Math.random()), Y(sh * 0.3 * Math.random()), hue(i, 40), 1);
}
function nextLevel() {
  const go = () => startLevel(Math.min(LEVELS.length, level + 1));
  if (level % 3 === 0) showAd('midgame', go); else go();   // an ad break every third level
}

// ---- Screens
function background() { g.fillStyle = C.page; g.fillRect(0, 0, W, H); }
function drawMenu() {
  const cx = X(sw / 2), s = u * (land ? 8 : 11), hw = s * 6, hh = s * 3, hy = Y(land ? 34 : 52);
  // Hero card: a line drawing itself. PLAY is the one accent.
  card(cx - hw / 2, hy, hw, hh, u * 6);
  const pts = [[-2, 0], [-1, 0], [-1, 1], [0, 1], [1, 1], [1, 0], [2, 0]], k = Math.min(pts.length, 2 + Math.floor((time * 3) % (pts.length + 3))), top = hy + s;
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = s * 0.4; g.strokeStyle = C.accent;
  g.beginPath(); for (let i = 0; i < k; i++) g.lineTo(cx + pts[i][0] * s, top + pts[i][1] * s); g.stroke();
  pts.forEach((p, i) => { g.fillStyle = i < k ? C.accent : C.line; g.beginPath(); g.arc(cx + p[0] * s, top + p[1] * s, s * 0.2, 0, TAU); g.fill(); });
  g.fillStyle = C.text; g.beginPath(); g.arc(cx + pts[k - 1][0] * s, top + pts[k - 1][1] * s, s * 0.2, 0, TAU); g.fill();
  head('One Line', cx, Y(land ? 12 : 26), u * (land ? 14 : 18));
  tag('Fill every cell', cx, Y(land ? 23 : 40), u * 3);
  button('Play', land ? cx - u * 33 : cx, Y(land ? 84 : 112), u * (land ? 60 : 84), u * (land ? 12 : 14), true, () => {
    if (save.unlocked === 1 && !save.stars[1]) startLevel(1); else { page = Math.floor((save.unlocked - 1) / 20); screen = 'levels'; }
  });
  button(dailyDone() ? 'Daily done  ·  ' + save.streak + ' day' + (save.streak > 1 ? 's' : '') : 'Daily challenge', land ? cx + u * 33 : cx, Y(land ? 84 : 126), u * (land ? 60 : 84), u * (land ? 12 : 10), false, startDaily, u * 3.4);
  let total = 0; for (const n in save.stars) total += save.stars[n];
  star(cx - u * 9, Y(land ? 95 : 138) - u * 0.2, u * 2, C.text); tag(total + ' / ' + LEVELS.length * 3, cx - u * 5, Y(land ? 95 : 138), u * 2.8, C.soft, 'left');
  roundBtn('♪', X(sw - 9), Y(9), () => { save.muted = !save.muted; persist(); }, save.muted);
}
function drawLevels() {
  const cx = X(sw / 2), cols = land ? 5 : 4, rows = 20 / cols, pages = LEVELS.length / 20;
  head('Levels', cx, Y(9), u * 8);
  roundBtn('‹', X(9), Y(9), () => { screen = 'menu'; });
  const gx = land ? 30 : 8, gw = sw - gx * 2, gy = 20, gh = sh - 20 - 20;
  const cw = gw / cols, ch = gh / rows, s = Math.min(cw, ch) * 0.86 * u;
  for (let k = 0; k < 20; k++) {
    const n = page * 20 + k + 1;
    const x = X(gx + (k % cols + 0.5) * cw), y = Y(gy + (Math.floor(k / cols) + 0.5) * ch), open = n <= save.unlocked, cur = n === save.unlocked && !save.stars[n];
    if (open) card(x - s / 2, y - s / 2, s, s, u * 4);
    else { rrect(x - s / 2, y - s / 2, s, s, u * 4); g.lineWidth = hair(); g.strokeStyle = C.line; g.stroke(); }
    if (cur) { rrect(x - s / 2, y - s / 2, s, s, u * 4); g.lineWidth = u * 0.6; g.strokeStyle = C.accent; g.stroke(); }
    head(String(n), x, y - s * 0.1, s * 0.44, open ? C.text : C.line);
    const st = save.stars[n] || 0;
    if (open) for (let j = 0; j < 3; j++) star(x + (j - 1) * s * 0.22, y + s * 0.28, s * 0.085, j < st ? C.text : C.line);
    if (open) btns.push({ x: x - s / 2, y: y - s / 2, w: s, h: s, action: () => startLevel(n) });
  }
  const by = Y(sh - 9);
  if (page > 0) roundBtn('‹', cx - u * 22, by, () => { page--; });
  tag((page + 1) + ' / ' + pages, cx, by, u * 3);
  if (page < pages - 1) roundBtn('›', cx + u * 22, by, () => { page++; });
}
function drawBoard() {
  const p = geo(), c = p.cell, mid = (x, y) => [p.bx + (x + 0.5) * c, p.by + (y + 0.5) * c];
  for (const k of cells) {
    const x = k % 10, y = Math.floor(k / 10), on = inLine(x, y) >= 0;
    g.fillStyle = on ? C.line : C.card; rrect(p.bx + x * c + c * 0.05, p.by + y * c + c * 0.05, c * 0.9, c * 0.9, c * 0.2); g.fill();
  }
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = c * 0.38;
  for (let i = 1; i < line.length; i++) {
    const a = mid(line[i - 1][0], line[i - 1][1]), b = mid(line[i][0], line[i][1]);
    g.strokeStyle = hue(i, cells.size); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  const s0 = mid(lv.path[0][0], lv.path[0][1]);
  g.fillStyle = hue(0, cells.size); g.beginPath(); g.arc(s0[0], s0[1], c * 0.27, 0, TAU); g.fill();
  const hd = line[line.length - 1], hm = mid(hd[0], hd[1]);
  g.fillStyle = C.text; g.beginPath(); g.arc(hm[0], hm[1], c * (0.2 + pulse * 0.08 + Math.sin(time * 5) * 0.015), 0, TAU); g.fill();
  // Wordless tutorial on level 1: a ghost dot runs ahead along the solution.
  if (level === 1 && screen === 'game' && line.length < cells.size) {
    let same = 0;
    while (same < line.length && line[same][0] === lv.path[same][0] && line[same][1] === lv.path[same][1]) same++;
    if (same === line.length) {
      const f = (time * 2.2) % 1, a = mid(hd[0], hd[1]), b = mid(lv.path[same][0], lv.path[same][1]);
      g.fillStyle = 'rgba(255,255,255,' + (0.75 * (1 - f)) + ')';
      g.beginPath(); g.arc(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, c * 0.14, 0, TAU); g.fill();
    }
  }
}
function drawGame() {
  const cx = X(sw / 2);
  roundBtn('‹', X(9), Y(9), () => { gameplay(false); page = Math.floor((level - 1) / 20); screen = daily ? 'menu' : 'levels'; });
  head(daily ? 'Daily' : 'Level ' + level, cx, Y(7.5), u * 7.2);
  tag(line.length + ' / ' + cells.size, cx, Y(15), u * 2.6);
  roundBtn('♪', X(sw - 9), Y(9), () => { save.muted = !save.muted; persist(); }, save.muted);
  drawBoard();
  const list = [
    [hints > 0 ? 'Hint  ' + hints : '▶  Hint', useHint, true],
    ['Clear', rewind, line.length > 1]
  ];
  list.forEach((it, i) => {
    const bx = land ? X(135) : cx + (i - 0.5) * u * 44, by = land ? Y(42 + i * 17) : Y(sh - 12);
    g.globalAlpha = it[2] ? 1 : 0.45;
    button(it[0], bx, by, u * 40, u * 10, false, it[1], u * 3.4);
    g.globalAlpha = 1;
  });
}
function drawWin() {
  const cx = X(sw / 2), cy = Y(sh / 2);
  drawBoard();
  if (winT < 0.7) return;
  g.fillStyle = 'rgba(0,0,0,' + (0.6 * Math.min(1, (winT - 0.7) / 0.3)) + ')'; g.fillRect(0, 0, W, H);
  if (winT < 1) return;
  const pw = u * 84, ph = u * 80;
  card(cx - pw / 2, cy - ph / 2, pw, ph, u * 6);
  tag(daily ? 'Daily challenge  ·  ' + save.streak + ' day streak' : 'Level ' + level, cx, cy - u * 32, u * 2.8);
  head(earned === 3 ? 'Perfect' : 'Filled', cx, cy - u * 22, u * 13);
  for (let j = 0; j < 3; j++) {
    const k = Math.max(0, Math.min(1, (winT - 1.1 - j * 0.2) / 0.2));
    star(cx + (j - 1) * u * 16, cy - u * 5, u * 6 * (j < earned ? 0.6 + 0.4 * k : 1), j < earned && k > 0 ? C.text : C.line);
  }
  if (daily) button('Done', cx, cy + u * 14, u * 68, u * 13, true, () => { screen = 'menu'; }); else if (level < LEVELS.length) button('Next level', cx, cy + u * 14, u * 68, u * 13, true, nextLevel);
  else tag('All ' + LEVELS.length + ' levels done', cx, cy + u * 14, u * 3);
  button('Replay', cx - u * 17.5, cy + u * 30, u * 33, u * 10, false, again, u * 3.4);
  button('Levels', cx + u * 17.5, cy + u * 30, u * 33, u * 10, false, () => { page = Math.floor((level - 1) / 20); screen = 'levels'; }, u * 3.4);
}

// ---- Input: press and drag across the cells.
function cellUnder(x, y) {
  const p = geo(), cx = Math.floor((x - p.bx) / p.cell), cy = Math.floor((y - p.by) / p.cell);
  return cx >= 0 && cy >= 0 && cx < lv.w && cy < lv.h ? [cx, cy] : null;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (adPlaying) return;
  initAudio();
  const x = e.clientX, y = e.clientY;
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { sfx.click(); b.action(); return; }
  }
  if (screen !== 'game') return;
  const c = cellUnder(x, y);
  if (!c) return;
  // Tapping a cell already on the line cuts the line back to it.
  const i = inLine(c[0], c[1]);
  if (i >= 0 && i < line.length - 1) { line.length = i + 1; sfx.back(); }
  dragging = true; visit(c[0], c[1]);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!dragging || screen !== 'game') return;
  const c = cellUnder(e.clientX, e.clientY);
  if (c) visit(c[0], c[1]);
});
const stopDrag = () => { dragging = false; };
cv.addEventListener('pointerup', stopDrag);
cv.addEventListener('pointercancel', stopDrag);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else if (!adPlaying) ac.resume();
});

// ---- Main loop
function update(dt) {
  time += dt;
  if (pulse > 0) pulse = Math.max(0, pulse - dt * 5);
  if (screen === 'win') winT += dt;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += u * 90 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function draw() {
  btns = [];
  background();
  if (screen === 'menu') drawMenu();
  else if (screen === 'levels') drawLevels();
  else if (screen === 'game') drawGame();
  else drawWin();
  for (const p of parts) {
    g.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
}
if (LOCAL && QS.get('daily')) startDaily();
// Local test hook: ?level=N opens a level, &steps=K draws the first K cells, &win=1 finishes it.
// Local test hook: ?selftest=1 puts the level count and the levels whose sample line leaves the board or crosses itself in the page title.
if (LOCAL && QS.get('selftest')) document.title = 'selftest:' + LEVELS.length + ':' + LEVELS.map((b, i) => {
  const l = makeLevel(i + 1), seen = new Set(l.path.map(p => p[0] + ',' + p[1]));
  return seen.size === l.path.length && l.path.every(p => p[0] >= 0 && p[1] >= 0 && p[0] < l.w && p[1] < l.h) ? 0 : i + 1;
}).filter(Boolean).join(',');
if (LOCAL && QS.get('level')) {
  startLevel(+QS.get('level'));
  const k = QS.get('win') ? lv.path.length : +QS.get('steps') || 1;
  line = lv.path.slice(0, k).map(p => p.slice());
  if (QS.get('win')) { persist = () => {}; win(); winT = 3; }
}
// Local trailer renderer: traces a few levels at a fixed 30 fps and posts each frame to the
// local capture server.
async function demoLoop() {
  const dt = 1 / 30, tour = [5, 28, 60, 85];
  let n = 0, mt = 0, li = 0;
  persist = () => {};
  const snap = async () => {
    update(dt); draw();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.93));
    await fetch('/frame?v=' + DEMO + '&n=' + String(n++).padStart(4, '0'), { method: 'POST', body: blob });
  };
  screen = 'menu';
  for (let i = 0; i < 36; i++) await snap();
  startLevel(tour[0]);
  while (n < 516) {
    mt += dt;
    if (screen === 'game' && mt > 0.11) { mt = 0; const p = lv.path[line.length]; visit(p[0], p[1]); }
    if (screen === 'win' && winT > 2.4) { if (++li >= tour.length) break; startLevel(tour[li]); }
    await snap();
  }
  await fetch('/frame?v=' + DEMO + '&n=done', { method: 'POST', body: 'x' });
}
// Local cover renderer (?demo=cover&w=&h=): a half-drawn board under the title, posted as a PNG.
async function coverShot() {
  persist = () => {};
  startLevel(46); time = 0.4;
  line = lv.path.slice(0, Math.floor(lv.path.length * 0.62));
  background(); drawBoard();
  head('One Line Fill', X(sw / 2), Y(land ? 9 : 12), u * (land ? 11 : 13));
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  await fetch('/frame?v=' + DEMO + '-' + W + 'x' + H + '&n=cover&ext=png', { method: 'POST', body: blob });
  await fetch('/frame?v=' + DEMO + '-' + W + 'x' + H + '&n=done', { method: 'POST', body: 'x' });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!adPlaying) update(dt);
  draw();
  requestAnimationFrame(frame);
}
if (DEMO === 'cover') coverShot(); else if (DEMO) demoLoop(); else requestAnimationFrame(frame);
})();
</script>
