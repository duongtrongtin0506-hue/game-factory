<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter</title><style>
*{box-sizing:border-box}body{margin:0;min-width:300px;max-width:100%;font:14px/1.4 system-ui,Segoe UI,Arial;color:#10241E;background:#F3FBF8}
header{background:#00A884;color:#fff;padding:12px 14px;font-weight:700}main{padding:14px}button{border:0;border-radius:999px;padding:10px 14px;font-weight:700;background:#00A884;color:#fff;margin:4px 4px 4px 0;cursor:pointer}
button.alt{background:#DDEFE8;color:#10241E}.big{font:700 40px system-ui;color:#00A884}.sub{color:#5B6E67;margin:6px 0 10px;overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:6px}
pre{white-space:pre-wrap;word-break:break-all;background:#fff;border-radius:10px;padding:10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:#fff;border-radius:12px;padding:10px;color:#5B6E67}
.grid b{display:block;font-size:22px;color:#00A884}table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid #DDEFE8}.sw{width:34px;height:34px;padding:0;border-radius:10px}#msg{min-height:18px;color:#00A884;font-weight:700}
</style></head><body><header>Word Counter</header><main><div class='grid'><div><b id='w'>–</b>words</div><div><b id='c'>–</b>characters</div><div><b id='r'>–</b>min read</div><div><b id='s'>–</b>min speak</div></div><div class='sub' id='src'></div><div id="msg"></div></main><script src="common.js"></script><script src="popup.js"></script></body></html>
